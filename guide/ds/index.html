    <div class="shf-row"><span class="mf-cap">아주 작음</span><div class="shf-box" style="width:auto"><header class="ui-shead ui-shead--xs"><h2 class="ui-shead__title">Heading XXSmall<span class="shf-spec">14px</span></h2><span class="ui-shead__trail">Text</span></header></div></div>
    <div class="shf-row"><span class="mf-cap">작음</span><div class="shf-box" style="width:auto"><header class="ui-shead ui-shead--s"><h2 class="ui-shead__title">Heading Small<span class="shf-spec">18px</span></h2><span class="ui-shead__trail">Text</span></header></div></div>
    <div class="shf-row"><span class="mf-cap">보통</span><div class="shf-box" style="width:auto"><header class="ui-shead ui-shead--m"><h2 class="ui-shead__title">Heading Medium<span class="shf-spec">20px</span></h2><span class="ui-shead__trail">Text</span></header></div></div>
    <div class="shf-row"><span class="mf-cap">큼</span><div class="shf-box" style="width:auto"><header class="ui-shead ui-shead--l"><h2 class="ui-shead__title">Heading XLarge<span class="shf-spec">24px</span></h2><span class="ui-shead__trail">Text</span></header></div></div>
  </div></figure><p>화면 안의 위계에 따라 크기를 고릅니다. 높이는 제목 글자의 줄 높이로 정해집니다.</p></section>

text"><b>예약 일정을 저장했어요</b><span>11월 14일(목) 오후 2시에 이용해요.</span></div><button class="ui-snack__action" type="button">보기</button></div></div><span class="mf-cap">제목과 설명</span></div><div class="mf-col"><div style="width:380px"><div class="ui-snack"><div class="ui-snack__text"><span>11월 14일(목) 오후 2시에 이용해요.</span></div><button class="ui-snack__action" type="button">보기</button></div></div><span class="mf-cap">설명만</span></div></div></figure><h3 class="mt-sub" id="type-leading-content" data-toc="Leading content">Leading content</h3><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><div style="width:380px"><div class="ui-snack"><div class="ui-snack__text"><b>예약 일정을 저장했어요</b></div><button class="ui-snack__action" type="button">보기</button></div></div><span class="mf-cap">끔</span></div><div class="mf-col"><div style="width:380px"><div class="ui-snack"><span class="ui-snack__lead"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-calendar"/></svg></span><div class="ui-snack__text"><b>예약 일정을 저장했어요</b></div><button class="ui-snack__action" type="button">보기</button></div></div><span class="mf-cap">켬</span></div></div></figure><h3 class="mt-sub" id="type-close-button" data-toc="Close button">Close button</h3><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><div style="width:380px"><div class="ui-snack"><div class="ui-snack__text"><b>예약 일정을 저장했어요</b></div><button class="ui-snack__action" type="button">보기</button></div></div><span class="mf-cap">끔</span></div><div class="mf-col"><div style="width:380px"><div class="ui-snack"><div class="ui-snack__text"><b>예약 일정을 저장했어요</b></div><button class="ui-snack__action" type="button">보기</button><button class="ui-snack__close" type="button" aria-label="닫기"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-close"/></svg></button></div></div><span class="mf-cap">켬</span></div></div></figure><h3 class="mt-sub" id="type-size" data-toc="Size">Size</h3><figure class="mf mf--white" data-fig="2"><div class="mf-col" style="gap:20px;width:420px"><span class="mf-measure" style="width:340px"><div class="ui-toast ui-toast--success"><svg class="cs-icon ui-toast__icon" aria-hidden="true"><use href="#cs-i-check"/></svg><span>모두가 안심하고 지낼 공간을 만들어요.</span></div><i class="mf-hbar" data-size="height: 54px"></i></span><div style="width:420px"><div class="ui-toast ui-toast--success"><svg class="cs-icon ui-toast__icon" aria-hidden="true"><use href="#cs-i-check"/></svg><span>꼭 필요한 서비스를 쉽고 빠르게 연결해 더 편리한 일상을 만듭니다.</span></div></div><i class="mf-wbar" data-size="max-width: 420px" style="width:420px"></i></div></figure><p>기본 높이 54px, 글은 최대 두 줄, 최대 너비 420px입니다.</p></section><section id="w-status" class="mt-sec"><h2>Status</h2><figure class="mf" data-fig="3"><div class="mf-grid" style="grid-template-columns:90px 340px;gap:10px 16px"><span class="mf-cap mf-cap--strong">Normal</span><div class="ui-toast ui-toast--normal"><svg class="cs-icon ui-toast__icon" aria-hidden="true"><use href="#cs-i-share"/></svg><span>링크를 복사했어요.</span></div><span class="mf-cap mf-cap--strong">Success</span><div class="ui-toast ui-toast--success"><svg class="cs-icon ui-toast__icon" aria-hidden="true"><use href="#cs-i-check"/></svg><span>신청서를 등록했어요.</span></div><span class="mf-cap mf-cap--strong">Warning</span><div class="ui-toast ui-toast--warning"><svg class="cs-icon ui-toast__icon" aria-hidden="true"><use href="#cs-i-warning"/></svg><span>관심 지점은 최대 5개까지 고를 수 있어요.</span></div><span class="mf-cap mf-cap--strong">Error</span><div class="ui-toast ui-toast--danger"><svg class="cs-icon ui-toast__icon" aria-hidden="true"><use href="#cs-i-close"/></svg><span>사진을 올리지 못했어요. 다시 시도해 주세요.</span></div></div></figure><p>알림의 성격에 따라 아이콘으로 상황을 바로 알 수 있게 합니다.</p></section><section id="w-close-button" class="mt-sec"><h2>Close button</h2><figure class="mf" data-fig="3"><div style="width:340px"><div class="ui-snack"><div class="ui-snack__text"><span>정기 관리 신청을 마쳤어요.</span></div><button class="ui-snack__action" type="button">확인하기</button><button class="ui-snack__close" type="button" aria-label="닫기"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-close"/></svg></button></div></div></figure><p>닫기 버튼을 두어 바로 닫을 수 있게 할 수 있습니다. 오래 떠 있도록 설정했을 때 씁니다.</p></section><section id="w-accessibility" class="mt-sec"><h2>Accessibility</h2><ul class="mt-ul"><li><code>role="status"</code>(긴급하지 않음) 영역에 넣어 화면 읽기 프로그램이 하던 말을 끊지 않고 읽게 합니다. 실패 알림은 <code>role="alert"</code>를 씁니다.</li><li>버튼 있는 토스트는 화면 읽기 사용 중에는 자동으로 사라지지 않게 하거나 시간을 충분히 늘립니다.</li><li>토스트가 떠도 초점을 옮기지 않습니다.</li><li>마우스를 올리거나 초점이 들어오면 사라지는 시간을 멈춥니다.</li></ul></section><section id="w-usage" class="mt-sec"><h2>Usage</h2><h3 class="mt-sub" id="w-when-to-use-s" data-toc="When to Use">When to Use</h3><ul class="mt-ul"><li>저장 · 변경 · 복사처럼 결과를 짧게 확인시켜 줄 때 — '예약 일정을 바꿨어요'</li><li>지운 것을 되돌릴 기회를 줄 때 — '알림을 지웠어요 [되돌리기]'</li><li>꼭 읽고 넘어가야 하는 내용이나 되돌릴 수 없는 결과는 대화상자를 씁니다.</li></ul><h4 class="mt-sub2" id="toast-usage-position-ios">위치 · iOS</h4><figure class="mf" data-fig="4"><div class="mf-stack" style="width:min(100%, 560px);gap:18px">

__desc">첫 이용이 끝나면 여기에서 리포트를 볼 수 있어요.</p><div class="ui-fallback__actions"><button type="button" class="ui-btn ui-btn--rank4 ui-btn--md">닫기</button><button type="button" class="ui-btn ui-btn--rank1 ui-btn--md">새로 고침</button></div></div></div><span class="mf-cap">가로</span></div><div class="mf-col"><div style="width:420px;background:var(--cs-surface-screen);border-radius:16px;box-shadow:inset 0 0 0 1px var(--doc-line)"><div class="ui-fallback ui-fallback--desktop"><h2 class="ui-fallback__heading">받은 이용 리포트가 없어요</h2><p class="ui-fallback__desc">첫 이용이 끝나면 여기에서 리포트를 볼 수 있어요.</p><div class="ui-fallback__actions ui-fallback__actions--v"><button type="button" class="ui-btn ui-btn--rank1 ui-btn--md">새로 고침</button><button type="button" class="ui-btn ui-btn--rank4 ui-btn--md">닫기</button></div></div></div><span class="mf-cap">세로</span></div><div class="mf-col"><div style="width:420px;background:var(--cs-surface-screen);border-radius:16px;box-shadow:inset 0 0 0 1px var(--doc-line)"><div class="ui-fallback ui-fallback--desktop"><h2 class="ui-fallback__heading">받은 이용 리포트가 없어요</h2><p class="ui-fallback__desc">첫 이용이 끝나면 여기에서 리포트를 볼 수 있어요.</p></div></div><span class="mf-cap">끔</span></div></div></figure><h3 class="mt-sub" id="type-size" data-toc="Size">Size</h3><figure class="mf mf--white" data-fig="2"><div class="mf-row" style="gap:24px;align-items:flex-start"><div class="mf-col"><span class="mf-cap">Desktop</span><div class="fbf-box fbf-pad" style="width:260px"><div class="ui-fallback ui-fallback--desktop "><h2 class="ui-fallback__heading">Heading</h2><p class="ui-fallback__desc">Description</p><div class="ui-fallback__actions"><button class="ui-btn ui-btn--rank4 ui-btn--md" type="button">Button</button></div></div></div></div><div class="mf-col"><span class="mf-cap">Mobile</span><div class="fbf-box fbf-pad" style="width:220px"><div class="ui-fallback ui-fallback--mobile "><h2 class="ui-fallback__heading">Heading</h2><p class="ui-fallback__desc">Description</p><div class="ui-fallback__actions"><button class="ui-btn ui-btn--rank4 ui-btn--sm" type="button">Button</button></div></div></div></div></div></figure><p>모바일 · 데스크톱 화면에 맞는 크기를 씁니다. 플랫폼에 따라 제목 · 설명 글자 크기와 버튼 크기 · 간격이 정해집니다.</p></section><section id="w-compact" class="mt-sec"><h2>Compact</h2><figure class="mf" data-fig="3"><div class="mf-phone mf-phone--cut" style="height:300px"><div class="mf-screen"><div class="fbf-search"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-search"/></svg>강남 지점</div><div class="fbf-tabs"><span>전체</span><span>서비스</span><b>지점(0)</b><span>관리 소식</span></div><div class="ui-fallback ui-fallback--mobile ui-fallback--compact"><p class="ui-fallback__desc">검색어에 맞는 지점이 없어요.<br>다른 지역으로 검색해 보세요.</p></div><div style="padding:10px 14px;border-top:8px solid var(--cs-surface-muted)"><b style="font-size:12px">가까운 지점 추천</b><div style="display:flex;gap:8px;margin-top:8px"><span class="mf-block" style="width:90px;height:50px"></span><span class="mf-block" style="width:90px;height:50px"></span></div></div></div></div></figure><p>화면 전체가 아니라 한 구역 안에 둘 때는 위아래 여백을 줄인 촘촘한 모양을 씁니다.</p></section><section id="w-heading" class="mt-sec"><h2>Heading</h2><figure class="mf" data-fig="4"><div class="mf-row" style="gap:20px"><div class="mf-col"><span class="mf-cap">With Heading</span><div class="fbf-box" style="width:220px"><div class="ui-fallback ui-fallback--mobile "><h2 class="ui-fallback__heading">새로운 알림이 없어요</h2><p class="ui-fallback__desc">예약 일정이나 리포트 소식이 생기면 여기에서 알려 드릴게요.</p></div></div></div><div class="mf-col"><span class="mf-cap">No Heading</span><div class="fbf-box" style="width:220px"><div class="ui-fallback ui-fallback--mobile "><p class="ui-fallback__desc">예약 일정이나 리포트 소식이 생기면 여기에서 알려 드릴게요.</p></div></div></div></div></figure><p>상태를 강조할 때는 제목을 넣고, 작은 구역 안에서는 제목 없이 설명만 둡니다.</p></section><section id="w-accessibility" class="mt-sec"><h2>Accessibility</h2><ul class="mt-ul"><li>결과 화면이 나타나면 제목으로 초점을 옮겨 상황을 바로 읽게 합니다.</li><li>그림은 꾸밈용이므로 <code>alt=""</code>로 둡니다.</li><li>오류 원인을 색이나 그림만으로 알리지 않고 글로 씁니다.</li></ul></section><section id="w-usage" class="mt-sec"><h2>Usage</h2><h3 class="mt-sub" id="w-when-to-use-s" data-toc="When to Use">When to Use</h3><ul class="mt-ul"><li>빈 상태: 아직 이용 내역이 없을 때, 검색 결과가 없을 때</li><li>오류: 불러오기 실패, 인터넷 연결 끊김, 권한 없음</li><li>완료: 서비스 신청 · 결제가 끝난 뒤의 결과 화면</li></ul><h4 class="mt-sub2" id="usage-empty-state">빈 상태</h4><figure class="mf" data-fig="5"><div class="fbf-box"><div class="ui-fallback ui-fallback--mobile "><h2 class="ui-fallback__heading">받은 이용 리포트가 없어요</h2><p class="ui-fallback__desc">새로 고침하고 업데이트된<br>리포트를 확인해 보세요.</p><div class="ui-fallback__actions"><button class="ui-btn ui-btn--rank4 ui-btn--sm" type="button">새로 고침</button></div></div></div></figure><p>보여줄 내용이 없을 때 이유를 알려주고 다음 행동을 이끕니다. 처음 써서 기록이 없거나, 검색 · 필터 결과가 없을 때 씁니다.</p></section>

<template id="tpl-skeleton">

<section id="glance" class="mt-sec mt-sec--intro"><p class="mt-lead">내용을 불러오는 동안 해당 위치에 회색 영역으로 형태를 미리 보여주는 요소입니다. 나타날 내용을 예상하게 하고, 내용이 갑자기 나타나는 깜빡임을 줄입니다.</p></section><section id="w-anatomy" class="mt-sec"><h2>Structure</h2><figure class="mf mf--labels mf--white" data-fig="1"><div class="skf-box" style="display:flex;gap:12px;align-items:center;transform:scale(1.2)"><span class="ui-skel ui-skel--rect is-static" style="--w:64px;--h:48px" data-pin="1" data-pin-dir="l"></span><div class="ui-skel-lines"><span class="ui-skel ui-skel--text" style="--w:80%;animation:none"></span><span class="ui-skel ui-skel--text" style="--w:50%;animation:none"></span></div></div></figure><ol class="mt-anatomy"><li><b>1</b>모양</li></ol></section><section id="w-variants" class="mt-sec"><h2>Type</h2><h3 class="mt-sub" id="type-style" data-toc="Style">Style</h3><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><div class="ui-skel-lines" style="width:200px"><span class="ui-skel ui-skel--text"></span><span class="ui-skel ui-skel--text" style="--w:70%"></span></div><span class="mf-cap">글자</span></div><div class="mf-col"><span class="ui-skel ui-skel--rect" style="--w:200px;--h:120px"></span><span class="mf-cap">사각형</span></div><div class="mf-col"><span class="ui-skel ui-skel--circle" style="--s:80px"></span><span class="mf-cap">원형</span></div></div></figure><ul class="mt-ul"><li>불러오는 중: 회색 면이 2초 주기로 깜빡입니다.</li><li>불러옴: 실제 내용으로 바로 바뀝니다. 크기가 같아 화면이 흔들리지 않습니다.</li><li>실패: 스켈레톤을 지우고 결과 화면(오류)을 같은 자리에 보여줍니다.</li><li>3초 넘게 걸리면 로딩 문구를 덧붙이는 것을 검토합니다.</li></ul><h3 class="mt-sub" id="type-size" data-toc="Size">Size</h3><figure class="mf mf--white" data-fig="2"><div class="skf-grid"><span class="mf-cap mf-cap--strong">Text</span><span class="ui-skel ui-skel--text" style="--w:100px;animation:none"></span><span class="skf-arrow">→</span><div class="ui-skel-lines" style="width:120px"><span class="ui-skel ui-skel--text" style="--w:120px;animation:none"></span><span class="ui-skel ui-skel--text" style="--w:120px;animation:none"></span></div>
  <span class="mf-cap mf-cap--strong">Rectangle</span><span class="ui-skel ui-skel--rect" style="--w:56px;--h:56px;animation:none"></span><span class="skf-arrow">→</span><span class="ui-skel ui-skel--rect" style="--w:120px;--h:80px;animation:none"></span>
  <span class="mf-cap mf-cap--strong">Circle</span><span class="ui-skel ui-skel--circle" style="--s:48px;animation:none"></span><span class="skf-arrow">→</span><span class="ui-skel ui-skel--circle" style="--s:80px;animation:none"></span></div></figure><p>너비와 높이를 내용 크기에 맞춥니다. 글자형은 높이가 커지면 여러 줄로 나뉩니다.</p></section>

<template id="tpl-top-navigation">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>상단 바 <small class="pi-en">TopNavigation</small></h1></div>
<nav class="mt-toc" aria-label="이 페이지 목차"><a href="#w-anatomy">Structure</a><a href="#w-variants">Type</a><a href="#w-states">State</a></nav>
<section id="glance" class="mt-sec mt-sec--intro"><p class="mt-lead">화면 상단에서 현재 화면을 알려주고, 뒤로 가기와 화면 관련 행동을 담는 영역입니다.</p></section><section id="w-anatomy" class="mt-sec"><h2>Structure</h2><p>높이 56px 안에 화면 제목과 오른쪽 행동을 둡니다. 왼쪽 뒤로 가기는 유형에 따라 붙습니다(Type 참고). 제목은 왼쪽 정렬이고 한 줄을 넘으면 말줄임합니다.</p><figure class="mf mf--labels mf--white"><div style="width:360px;border-radius:12px;overflow:hidden"><header class="ui-topnav ui-topnav--start" data-pin="3" data-pin-dir="b"><span></span><h1 class="ui-topnav__title"><span data-pin="1" data-pin-dir="t">타이틀</span></h1><span class="ui-topnav__trail" data-pin="2" data-pin-dir="r"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-search"/></svg><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-menu"/></svg></span></header></div></figure><ol class="mt-anatomy"><li><b>1</b>화면 제목</li><li><b>2</b>오른쪽 행동</li><li><b>3</b>바탕</li></ol></section><section id="w-variants" class="mt-sec"><h2>Type</h2><p>화면의 위치에 따라 네 가지 중 하나를 고릅니다. 뒤로 갈 수 있는 화면은 뒤로 가기를, 화면을 덮는 창은 닫기를 둡니다.</p><figure class="mf mf--white"><div class="tn-types"><div class="tn-type"><div class="tn-frame"><header class="ui-topnav ui-topnav--start ui-topnav--home"><span class="ui-topnav__lead"><span class="tn-logo">LOGO</span></span><span></span><span class="ui-topnav__trail"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-menu"/></svg></span></header><div class="tn-body"></div></div><p class="tn-cap"><b>Home</b> 홈<br><span>로고 + 전체 메뉴. 홈 · 최상위 화면에만 쓰고, 뒤로 가기는 두지 않습니다.</span></p></div><div class="tn-type"><div class="tn-frame"><header class="ui-topnav ui-topnav--start"><span class="ui-topnav__lead"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-chevron-left"/></svg></span><h1 class="ui-topnav__title">타이틀</h1><span class="ui-topnav__trail"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-more"/></svg><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-filter"/></svg></span></header><div class="tn-body"></div></div><p class="tn-cap"><b>Sub</b> 하위 화면 · 아이콘<br><span>뒤로 가기 + 제목 + 아이콘 행동(최대 3개). 가장 많이 쓰는 유형입니다.</span></p></div><div class="tn-type"><div class="tn-frame"><header class="ui-topnav ui-topnav--start"><span class="ui-topnav__lead"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-chevron-left"/></svg></span><h1 class="ui-topnav__title">타이틀</h1><span class="ui-topnav__trail"><span class="ui-topnav__text">버튼</span></span></header><div class="tn-body"></div></div><p class="tn-cap"><b>Sub</b> 하위 화면 · 글자<br><span>완료 · 저장처럼 화면의 주요 행동은 글자로, 브랜드 색으로 표시합니다.</span></p></div><div class="tn-type"><div class="tn-frame"><header class="ui-topnav ui-topnav--start"><span></span><h1 class="ui-topnav__title">타이틀</h1><span class="ui-topnav__trail"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-close"/></svg></span></header><div class="tn-body"></div></div><p class="tn-cap"><b>Fullscreen</b> 전체 화면 창<br><span>화면 전체를 덮는 창. 뒤로 가기 대신 오른쪽에 닫기를 둡니다.</span></p></div><div class="tn-type"><div class="tn-frame tn-frame--sheet"><header class="ui-topnav ui-topnav--start"><span></span><h1 class="ui-topnav__title">타이틀</h1><span class="ui-topnav__trail"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-close"/></svg></span></header><div class="tn-body"></div></div><p class="tn-cap"><b>Modal</b> 바텀시트 · 일부 창<br><span>화면 일부를 덮는 창과 바텀시트. 제목 + 닫기를 둡니다.</span></p></div></div></figure></section><section id="w-states" class="mt-sec"><h2>State</h2><p class="bt-state-lead">상태는 기본(Normal) · 스크롤됨(Scrolled) 두 가지입니다. 내용이 상단 바 밑으로 지나가기 시작하면 아래에 구분선을 표시합니다.</p><figure class="mf mf--white"><div class="tn-types"><div class="tn-type"><div class="tn-frame"><header class="ui-topnav ui-topnav--start"><span class="ui-topnav__lead"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-chevron-left"/></svg></span><h1 class="ui-topnav__title">타이틀</h1><span class="ui-topnav__trail"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-more"/></svg></span></header><div cl     var target = key !== 'soon' && arg && arg !== 'code' && arg !== 'design' ? main.querySelector('#' + CSS.escape(arg)) : null;
    if (main.dataset.tab) setTab(arg === 'code' || (target && target.closest('[data-tab="code"]')) ? 'code' : 'design'); else buildToc();
    if (target) setTimeout(function () { target.scrollIntoView(); }, 0); else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
  render();
})();

</script>
<script>
/* LNB 묶음(토글): 누르면 열고 닫음. 지금 페이지가 안에 있으면 자동으로 열림 */
window.NAV_FOLD_OPEN = window.NAV_FOLD_OPEN || {};

  var f = b.parentNode, open = !f.classList.contains('is-open');
