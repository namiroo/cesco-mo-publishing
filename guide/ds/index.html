<template id="tpl-spacing">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>Grid</h1><p>세스코 화면은 <b>4px 단위</b>로 간격과 크기를 맞춥니다. 화면 크기 · 간격 · 배치 · 모서리 네 가지만 지키면 어느 화면에서도 같은 리듬이 나옵니다.</p></div><nav class="mt-toc" aria-label="이 페이지 목차"><a href="#screen">Screen Sizes</a><a href="#space">Spacing</a><a href="#layout">Layout</a><a href="#radius">Corner Radius</a></nav><section id="screen" class="mt-sec"><h2>Screen Sizes</h2><p>모바일 화면을 기준으로 디자인하고, 넓은 화면은 같은 구성을 넓혀서 대응합니다.</p><div class="dk-table mt-table"><table><thead><tr><th>구간</th><th>화면 너비</th><th>디자인 화면</th><th>콘텐츠 최대 너비</th></tr></thead><tbody><tr><td><b>모바일</b></td><td>0–767px</td><td>iOS 375×812pt · 안드로이드 360×800dp · 모바일 웹 375×812px</td><td>–</td></tr><tr><td><b>태블릿</b></td><td>768–1199px</td><td>세로 768–991 · 가로 992–1199</td><td>–</td></tr><tr><td><b>데스크톱</b></td><td>1200px 이상</td><td>1440×900px</td><td>화면 설계 시 결정</td></tr></tbody></table></div></section><section id="space" class="mt-sec"><h2>Spacing</h2><p>간격은 <b>무엇과 무엇 사이인가</b>로 고릅니다. 같은 묶음 안은 좁게, 묶음 사이는 넓게 두어 여백만으로 관계가 보이게 합니다.</p><h3 class="mt-sub" data-toc="Within Elements">Within Elements <small class="pal-use">아이콘과 글자, 레이블과 보조 문구처럼 한 덩어리 안의 간격</small></h3><ol class="fg-ladder sp-ladder"><li class="sp-row"><span class="sp-bar"><i style="width:2px"></i></span><b>2</b><span class="sp-use">시각 보정 전용 (배지 안 위아래)</span></li><li class="sp-row"><span class="sp-bar"><i style="width:4px"></i></span><b>4</b><span class="sp-use">아이콘 ↔ 글자 · 레이블 ↔ 보조 문구</span></li><li class="sp-row"><span class="sp-bar"><i style="width:8px"></i></span><b>8</b><span class="sp-use">버튼 · 칩 · 관련 요소 사이</span></li></ol><h3 class="mt-sub" data-toc="Between Elements">Between Elements <small class="pal-use">카드 · 입력 칸 · 목록처럼 나란한 요소 사이</small></h3><ol class="fg-ladder sp-ladder"><li class="sp-row"><span class="sp-bar"><i style="width:12px"></i></span><b>12</b><span class="sp-use">제목 ↔ 내용 · 목록 위아래</span></li><li class="sp-row"><span class="sp-bar"><i style="width:16px"></i></span><b>16</b><span class="sp-use">카드 안 · 블록 사이</span></li><li class="sp-row"><span class="sp-bar"><i style="width:20px"></i></span><b>20</b><span class="sp-use">화면 좌우 여백 · 큰 카드 안</span></li><li class="sp-row"><span class="sp-bar"><i style="width:24px"></i></span><b>24</b><span class="sp-use">입력 칸 · 묶음 사이</span></li></ol><h3 class="mt-sub" data-toc="Between Sections">Between Sections <small class="pal-use">화면 안의 큰 덩어리 사이</small></h3><ol class="fg-ladder sp-ladder"><li class="sp-row"><span class="sp-bar"><i style="width:32px"></i></span><b>32</b><span class="sp-use">구역 사이</span></li><li class="sp-row"><span class="sp-bar"><i style="width:40px"></i></span><b>40</b><span class="sp-use">화면 제목 위</span></li><li class="sp-row"><span class="sp-bar"><i style="width:48px"></i></span><b>48</b><span class="sp-use">큰 구역 · 빈 화면</span></li><li class="sp-row"><span class="sp-bar"><i style="width:64px"></i></span><b>64</b><span class="sp-use">온보딩 · 결과 화면 위아래</span></li></ol></section><section id="layout" class="mt-sec"><h2>Layout</h2><p>모바일은 좌우 20px 안에 한 단으로 놓고, 카드를 나란히 둘 때만 두 단 · 12px 간격을 씁니다. 화면에서 자주 쓰는 자리는 아래 간격으로 고정합니다.</p><figure class="mf"><div class="mf-phone mf-phone--cut"><div class="mf-screen" style="padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;box-shadow:inset 20px 0 0 rgba(203,27,27,.1),inset -20px 0 0 rgba(203,27,27,.1)"><span class="mf-block" style="grid-column:1/-1;height:60px"></span><span class="mf-block" style="height:80px"></span><span class="mf-block" style="height:80px"></span></div></div></figure><div class="dk-table mt-table"><table><thead><tr><th>위치</th><th>간격</th></tr></thead><tbody><tr><td>화면 좌우 여백 · 모든 내용의 시작선</td><td>20px</td></tr><tr><td>상단 바 아래 첫 내용까지</td><td>24px</td></tr><tr><td>서로 다른 구역 사이 (구분선 없이 여백만으로 나눌 때)</td><td>32px</td></tr><tr><td>구역을 굵은 회색 띠로 나눌 때 띠 높이</td><td>8px</td></tr><tr><td>같은 구역 안의 카드 · 블록 사이</td><td>16px</td></tr><tr><td>구역 제목과 내용 사이</td><td>12px</td></tr><tr><td>하단 고정 버튼 영역 위아래 여백 (+ 기기 하단 여백)</td><td>16px</td></tr></tbody></table></div></section><section id="radius" class="mt-sec"><h2>Corner Radius</h2><p>요소가 클수록 모서리를 크게 둥글립니다. 한 화면 안에서 같은 크기의 요소는 같은 모서리를 씁니다.</p><ol class="fg-ladder rd-ladder"><li class="rd-row"><i class="rd-tile" style="border-radius:4px"></i><b>4</b><span class="fg-meta"><b>작은 요소</b><small>배지 · 태그 · 작은 썸네일</small></span></li><li class="rd-row"><i class="rd-tile" style="border-radius:8px"></i><b>8</b><span class="fg-meta"><b>작은 요소</b><small>작은 버튼 · 칩 · 도움말 · 썸네일</small></span></li><li class="rd-row"><i class="rd-tile" style="border-radius:12px"></i><b>12</b><span class="fg-meta"><b>보통 요소</b><small>버튼 · 입력 칸 · 토스트 · 세그먼트</small></span></li><li class="rd-row"><i class="rd-tile" style="border-radius:16px"></i><b>16</b><span class="fg-meta"><b>큰 면</b><small>카드 · 목록 묶음 · 배너</small></span></li><li class="rd-row"><i class="rd-tile" style="border-radius:20px"></i><b>20</b><span class="fg-meta"><b>큰 면</b><small>바텀시트 위쪽 · 대화상자</small></span></li><li class="rd-row"><i class="rd-tile" style="border-radius:50%"></i><b>원형</b><span class="fg-meta"><b>완전히 둥글게</b><small>알약형 칩 · 아바타 · 스위치 · 진행 막대</small></span></li></ol></section><footer>CESCO Mobile Design System · v0.9</footer>
</template>
<template id="tpl-elevation">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>Elevation</h1><p>화면의 요소는 바닥부터 알림까지 <b>다섯 층</b>으로 쌓입니다. 위층일수록 그림자가 깊어지고, 화면에서 더 앞에 놓입니다. 층은 그림자 · 바탕 색 · 쌓는 순서를 한 벌로 정해 두어, 층 이름 하나만 고르면 셋이 함께 정해집니다.</p></div><nav class="mt-toc" aria-label="이 페이지 목차"><a href="#layers">Layers</a><a href="#sheet">Bottom Sheet</a><a href="#dark">Dark Mode</a><a href="#rules">Usage Rules</a></nav><section id="layers" class="mt-sec"><h2>Layers</h2><p>층은 0~4 다섯 단계입니다. 대부분의 화면은 0 · 1 · 2만으로 충분하고, 3 · 4는 고객의 흐름을 잠깐 멈추게 할 때만 씁니다.</p><ol class="fg-ladder el-ladder"><li class="el-row"><span class="fg-lv">0</span><span class="el-stage"><i class="el-tile" style="background:var(--cs-elevation-0-surface);box-shadow:var(--cs-shadow-0)"></i></span><span class="fg-meta"><b>바닥</b><small>화면 바탕 · 회색 화면</small></span><span class="fg-code"><code>--cs-shadow-0</code><code>--cs-z-base · 0</code></span></li><li class="el-row"><span class="fg-lv">1</span><span class="el-stage"><i class="el-tile" style="background:var(--cs-elevation-1-surface);box-shadow:var(--cs-shadow-1)"></i></span><span class="fg-meta"><b>카드</b><small>목록 카드 · 정보 묶음. 바탕과 색이 같을 때만 그림자를 씁니다</small></span><span class="fg-code"><code>--cs-shadow-1</code><code>--cs-z-base · 0</code></span></li><li class="el-row"><span class="fg-lv">2</span><span class="el-stage"><i class="el-tile" style="background:var(--cs-elevation-2-surface);box-shadow:var(--cs-shadow-2)"></i></span><span class="fg-meta"><b>펼침</b><small>메뉴 · 드롭다운 · 도움말 · 상단에 붙는 바</small></span><span class="fg-code"><code>--cs-shadow-2</code><code>--cs-z-dropdown · 200</code></span></li><li class="el-row"><span class="fg-lv">3</span><span class="el-stage"><i class="el-tile" style="background:var(--cs-elevation-3-surface);box-shadow:var(--cs-shadow-3)"></i></span><span class="fg-meta"><b>창</b><small>대화상자 · 떠 있는 버튼. 뒤에 어두운 막(300)을 깝니다</small></span><span class="fg-code"><code>--cs-shadow-3</code><code>--cs-z-modal · 400</code></span></li><li class="el-row"><span class="fg-lv">4</span><span class="el-stage"><i class="el-tile" style="background:var(--cs-elevation-4-surface);box-shadow:var(--cs-shadow-4)"></i></span><span class="fg-meta"><b>알림</b><small>토스트 · 긴급 알림. 모든 층 위에 잠깐 뜹니다</small></span><span class="fg-code"><code>--cs-shadow-4</code><code>--cs-z-toast · 500</code></span></li></ol></section><section id="sheet" class="mt-sec"><h2>Bottom Sheet</h2><p>화면 아래에서 올라오는 바텀시트와 하단 버튼 영역은 그림자가 <b>위쪽</b>으로 생깁니다. 층은 3(창)과 같고 방향만 다릅니다.</p><figure class="mf el-sheet-fig"><div class="el-phone"><span class="el-phone__line"></span><span class="el-phone__line el-phone__line--s"></span><div class="el-sheet" style="background:var(--cs-elevation-3-surface);box-shadow:var(--cs-shadow-sheet)"><span class="el-handle"></span><span class="el-phone__line"></span><span class="el-phone__line el-phone__line--s"></span></div></div><div class="fg-code el-sheet-code"><code>--cs-shadow-sheet</code><code>--cs-z-modal · 400</code></div></figure></section><section id="dark" class="mt-sec"><h2>Dark Mode</h2><p>어두운 화면에서는 그림자가 잘 보이지 않습니다. 그래서 다크 모드에서는 <b>위층일수록 바탕을 조금씩 밝게</b> 해서 층을 나눕니다. 오른쪽 위 테마 버튼으로 바꾸면 위 견본이 그대로 바뀝니다.</p><figure class="mf el-dark-fig"><div class="el-dark"><span style="background:#121721">바닥<small>#121721</small></span><span style="background:#1B212B">카드<small>#1B212B</small></span><span style="background:#282E39">펼침 · 창<small>#282E39</small></span></div></figure></section><section id="rules" class="mt-sec"><h2>Usage Rules</h2><div class="mt-dodont mt-dodont--text"><div class="mt-dd mt-dd--do"><p class="mt-dd__label">이렇게</p><p>카드는 회색 화면 위에 흰 면으로 올려 색 차이로 구분합니다. 그림자는 흰 화면 위에 카드를 둘 때만 1층을 씁니다.</p></div><div class="mt-dd mt-dd--dont"><p class="mt-dd__label">이렇게 말고</p><p>카드 안의 버튼 · 칩에 그림자를 또 넣지 않습니다. 한 요소 안에서 층을 겹치면 깊이가 흐려집니다.</p></div></div><div class="mt-dodont mt-dodont--text"><div class="mt-dd mt-dd--do"><p class="mt-dd__label">이렇게</p><p>층을 고를 때는 그림자가 아니라 층 이름으로 고릅니다. 그림자 · 바탕 · 쌓는 순서가 함께 따라옵니다.</p></div><div class="mt-dd mt-dd--dont"><p class="mt-dd__label">이렇게 말고</p><p>그림자 값을 화면마다 새로 만들지 않습니다. 그림자 색은 검정이 아니라 세스코 네이비를 아주 옅게 쓴 정해진 값만 씁니다.</p></div></div></section><footer>CESCO Mobile Design System · v0.9</footer>
</template>
<template id="tpl-styles">
<div class="page-intro"><span class="section-id"></span><h1>Styles</h1><p>모든 화면이 함께 쓰는 시각 기준입니다. 컴포넌트와 화면은 여기의 값을 가져다 쓰고, 새 값을 따로 만들지 않습니다.</p></div>

<template id="tpl-icons">

="user 내 정보 마이 프로필 계정 사람"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-user"/></svg><span>내 정보</span><small>user</small></button><button type="button" class="sty-ic" data-kw="user-fill 내 정보 (선택) 마이 프로필 선택"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-user-fill"/></svg><span>내 정보 (선택)</span><small>user-fill</small></button><button type="button" class="sty-ic" data-kw="bell 알림 알람 소식 푸시"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg><span>알림</span><small>bell</small></button><button type="button" class="sty-ic" data-kw="bell-off 알림 끄기 알람 해제 무음"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell-off"/></svg><span>알림 끄기</span><small>bell-off</small></button><button type="button" class="sty-ic" data-kw="search 검색 찾기 돋보기"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-search"/></svg><span>검색</span><small>search</small></button><button type="button" class="sty-ic" data-kw="close 닫기 취소 엑스 x"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-close"/></svg><span>닫기</span><small>close</small></button><button type="button" class="sty-ic" data-kw="chevron-left 뒤로 이전 화살표 왼쪽"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-chevron-left"/></svg><span>뒤로</span><small>chevron-left</small></button><button type="button" class="sty-ic" data-kw="chevron-right 다음 이동 화살표 오른쪽 더보기"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-chevron-right"/></svg><span>다음</span><small>chevron-right</small></button><button type="button" class="sty-ic" data-kw="chevron-down 펼치기 아래 화살표 열기 선택"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-chevron-down"/></svg><span>펼치기</span><small>chevron-down</small></button><button type="button" class="sty-ic" data-kw="plus 추가 더하기 생성"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-plus"/></svg><span>추가</span><small>plus</small></button><button type="button" class="sty-ic" data-kw="minus 빼기 감소 수량"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-minus"/ ct x="10.9" y="10.6" width="2.2" height="6.4" rx="1.1" fill="#fff"/></svg><small>mi-info</small></div><div class="sty-ic" style="cursor:default"><svg style="width:24px;height:24px" class="mo-art" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3.5" width="18" height="17" rx="3.5" fill="#52AE9C"/><path d="M7.5 9h9M7.5 12.5h9M7.5 16h5.5" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg><small>mi-list</small></div><div class="sty-ic" style="cursor:default"><svg style="width:24px;height:24px" class="mo-art" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.5l7.5 2.8v6.1c0 4.9-3.2 8.8-7.5 10.6-4.3-1.8-7.5-5.7-7.5-10.6V5.3z" fill="#6A7F99"/><path d="M8.6 11.8l2.4 2.4 4.4-4.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><small>mi-shield</small></div><div class="sty-ic" style="cursor:default"><svg style="width:24px;height:24px" class="mo-art" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.8l2.75 5.6 6.15.9-4.45 4.33 1.05 6.12L12 16.87l-5.5 2.88 1.05-6.12L3.1 9.3l6.15-.9z" fill="#F5BE57" stroke="#F5BE57" stroke-width="1" stroke-linejoin="round"/></svg><small>mi-star</small></div></div><h3 class="mt-sub">업체 · 프로필 <small>(2)</small></h3><div class="sty-ic-grid"><div class="sty-ic" style="cursor:default"><svg style="width:36px;height:36px" class="mo-art" viewBox="0 0 60 60" width="60" height="60" aria-hidden="true"><circle cx="30" cy="30" r="30" fill="#F2F3F5"/><path fill="#CCCED6" fill-rule="evenodd" clip-rule="evenodd" d="M30 28.5c3.728 0 6.75-3.022 6.75-6.75S33.728 15 30 15s-6.75 3.022-6.75 6.75 3.022 6.75 6.75 6.75zm-4.5 3c-4.142 0-7.5 3.358-7.5 7.5v3a3 3 0 0 0 3 3h18a3 3 0 0 0 3-3v-3c0-4.142-3.358-7.5-7.5-7.5h-9z"/></svg><small>avatar-default</small></div><div class="sty-ic" style="cursor:default"><svg style="width:36px;height:36px;color:var(--cs-navy-400)" class="mo-art mo-art--line" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M3.5 13.8 10.2 10.4V20.5H3.5z"/><path fill="currentColor" d="M11.6 8.1 16.05 3.5 20.5 8.1V20.5H11.6z"/></svg><small>biz-fill</small></div></div><!--ART:END--></section><section id="rules" class="mt-sec"><h2>Usage Rules</h2><div class="mt-dodont mt-dodont--text"><div class="mt-dd mt-dd--do"><p class="mt-dd__label">이렇게</p><p>색은 글자 색을 따릅니다. 기본은 글자 1단계, 덜 중요하면 2 · 3단계, 상태를 알릴 때만 상태 색을 씁니다.</p></div><div class="mt-dd mt-dd--dont"><p class="mt-dd__label">이렇게 말고</p><p>아이콘에 임의의 색이나 그라데이션을 입히지 않습니다.</p></div></div><div class="mt-dodont mt-dodont--text"><div class="mt-dd mt-dd--do"><p class="mt-dd__label">이렇게</p><p>아이콘만 있는 버튼에는 화면 읽기용 이름(예: ‘알림’)을 붙이고, 누르는 영역은 44px 이상으로 둡니다.</p></div><div class="mt-dd mt-dd--dont"><p class="mt-dd__label">이렇게 말고</p><p>뜻이 헷갈리는 아이콘을 글자 없이 혼자 쓰지 않습니다.</p></div></div></section><footer>CESCO Mobile Design System · v0.9</footer>

<template id="tpl-motion">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>Motion</h1><p>세스코의 움직임은 <b>무엇이 바뀌었는지 알려 주는 데까지만</b> 씁니다. 짧고 조용하게, 같은 상황은 늘 같은 속도로 움직입니다. 장식을 위한 움직임은 쓰지 않습니다.</p></div>
<nav class="mt-toc" aria-label="이 페이지 목차"><a href="#moments">Moments</a><a href="#duration">Duration</a><a href="#easing">Easing</a><a href="#loop">Loop</a><a href="#reduced">Reduced Motion</a><a href="#rules">Usage Rules</a></nav>
<section id="moments" class="mt-sec"><h2>Moments</h2><p>움직임은 시간과 곡선을 따로 고르지 않고 <b>상황(모먼트)</b>으로 고릅니다. 상황 이름 하나에 시간과 곡선이 한 벌로 묶여 있습니다. 줄에 마우스를 올리거나 <b>재생</b>을 누르면 실제 값으로 움직입니다.</p><p><button type="button" class="mo-play" id="moPlay">▶ 모두 재생</button></p><ol class="fg-ladder mo-ladder" id="moLadder"><li class="mo-row" data-kind="press" style="--d:var(--cs-motion-feedback-duration);--e:var(--cs-motion-feedback-easing)"><span class="mo-stage"><i class="mo-obj"></i></span><span class="fg-meta"><b>누름 반응</b><small>버튼 · 리스트 행을 누르는 순간</small></span><span class="mo-val"><b>100ms</b><small>Standard</small></span><span class="fg-code"><code>--cs-motion-feedback-duration</code><code>--cs-motion-feedback-easing</code></span></li><li class="mo-row" data-kind="toggle" style="--d:var(--cs-motion-state-duration);--e:var(--cs-motion-state-easing)"><span class="mo-stage"><i class="mo-obj"></i></span><span class="fg-meta"><b>상태 바뀜</b><small>스위치 · 체크박스 · 탭 선택이 바뀔 때</small></span><span class="mo-val"><b>150ms</b><small>Standard</small></span><span class="fg-code"><code>--cs-motion-state-duration</code><code>--cs-motion-state-easing</code></span></li><li class="mo-row" data-kind="pop" style="--d:var(--cs-motion-enter-small-duration);--e:var(--cs-motion-enter-small-easing)"><span class="mo-stage"><i class="mo-obj"></i></span><span class="fg-meta"><b>작은 요소 등장</b><small>도움말 · 메뉴 · 토스트가 나타날 때</small></span><span class="mo-val"><b>200ms</b><small>Decelerate</small></span><span class="fg-code"><code>--cs-motion-enter-small-duration</code><code>--cs-motion-enter-small-easing</code></span></li><li class="mo-row" data-kind="fade" style="--d:var(--cs-motion-exit-small-duration);--e:var(--cs-motion-exit-small-easing)"><span class="mo-stage"><i class="mo-obj"></i></span><span class="fg-meta"><b>작은 요소 퇴장</b><small>도움말 · 메뉴 · 토스트가 사라질 때</small></span><span class="mo-val"><b>150ms</b><small>Accelerate</small></span><span class="fg-code"><code>--cs-motion-exit-small-duration</code><code>--cs-motion-exit-small-easing</code></span></li><li class="mo-row" data-kind="rise" style="--d:var(--cs-motion-enter-duration);--e:var(--cs-motion-enter-easing)"><span class="mo-stage"><i class="mo-obj"></i></span><span class="fg-meta"><b>큰 요소 등장</b><small>바텀시트 · 대화상자가 올라올 때</small></span><span class="mo-val"><b>300ms</b><small>Decelerate</small></span><span class="fg-code"><code>--cs-motion-enter-duration</code><code>--cs-motion-enter-easing</code></span></li><li class="mo-row" data-kind="drop" style="--d:var(--cs-motion-exit-duration);--e:var(--cs-motion-exit-easing)"><span class="mo-stage"><i class="mo-obj"></i></span><span class="fg-meta"><b>큰 요소 퇴장</b><small>바텀시트 · 대화상자가 내려갈 때</small></span><span class="mo-val"><b>200ms</b><small>Accelerate</small></span><span class="fg-code"><code>--cs-motion-exit-duration</code><code>--cs-motion-exit-easing</code></span></li><li class="mo-row" data-kind="slide" style="--d:var(--cs-motion-page-duration);--e:var(--cs-motion-page-easing)"><span class="mo-stage"><i class="mo-obj"></i></span><span class="fg-meta"><b>화면 전환</b><small>다음 화면으로 넘어갈 때</small></span><span class="mo-val"><b>300ms</b><small>Standard</small></span><span class="fg-code"><code>--cs-motion-page-duration</code><code>--cs-motion-page-easing</code></span></li><li class="mo-row" data-kind="grow" style="--d:var(--cs-motion-emphasis-duration);--e:var(--cs-motion-emphasis-easing)"><span class="mo-stage"><i class="mo-obj"></i></span><span class="fg-meta"><b>강조</b><small>카드를 눌러 상세로 펼칠 때</small></span><span class="mo-val"><b>400ms</b><small>Standard</small></span><span class="fg-code"><code>--cs-motion-emphasis-duration</code><code>--cs-motion-emphasis-easing</code></span></li></ol></section>
<section id="duration" class="mt-sec"><h2>Duration</h2><p>시간은 50ms 단위 8단계입니다. 작고 가까운 변화일수록 짧게, 크고 멀리 움직일수록 길게 씁니다. <b>500ms를 넘기지 않습니다.</b></p><ol class="fg-ladder sp-ladder"><li class="sp-row"><span class="sp-bar"><i style="width:10px"></i></span><b>50</b><span class="sp-use">색 · 투명도의 아주 작은 변화 <code>--cs-duration-50</code></span></li><li class="sp-row"><span class="sp-bar"><i style="width:20px"></i></span><b>100</b><span class="sp-use">누름 · 마우스 올림 반응 <code>--cs-duration-100</code></span></li><li class="sp-row"><span class="sp-bar"><i style="width:30px"></i></span><b>150</b><span class="sp-use">상태 바뀜 · 작은 요소 퇴장 <code>--cs-duration-150</code></span></li><li class="sp-row"><span class="sp-bar"><i style="width:40px"></i></span><b>200</b><span class="sp-use">작은 요소 등장 · 큰 요소 퇴장 <code>--cs-duration-200</code></span></li><li class="sp-row"><span class="sp-bar"><i style="width:50px"></i></span><b>250</b><span class="sp-use">드롭다운 · 도움말 등장 <code>--cs-duration-250</code></span></li><li class="sp-row"><span class="sp-bar"><i style="width:60px"></i></span><b>300</b><span class="sp-use">큰 요소 등장 · 화면 전환 <code>--cs-duration-300</code></span></li><li class="sp-row"><span class="sp-bar"><i style="width:80px"></i></span><b>400</b><span class="sp-use">강조 전환 (카드 → 상세) <code>--cs-duration-400</code></span></li><li class="sp-row"><span class="sp-bar"><i style="width:100px"></i></span><b>500</b><span class="sp-use">최대값 — 이보다 길게 쓰지 않음 (반복 제외) <code>--cs-duration-500</code></span></li></ol></section>
<section id="easing" class="mt-sec"><h2>Easing</h2><p>곡선은 다섯 가지입니다. 들어올 때는 Decelerate, 나갈 때는 Accelerate, 제자리에서 바뀔 때는 Standard를 씁니다.</p><div class="mo-eases"><div class="mo-ease" style="--e:var(--cs-easing-standard)"><div class="mo-ease__fig"><svg class="mo-curve" viewBox="-8 -30 116 146" aria-hidden="true"><path class="mo-axis" d="M0 100 H100 M0 100 V0"/><path class="mo-line" d="M0 100 C20 100 0 0 100 0"/></svg><span class="mo-track"><i></i></span></div><b>Standard</b><small>화면 안에서 위치 · 크기 · 색이 바뀔 때. 빠르게 출발해 부드럽게 멈춥니다.</small><code>--cs-easing-standard</code><code>cubic-bezier(0.3, 0, 0.1, 1)</code></div><div class="mo-ease" style="--e:var(--cs-easing-decelerate)"><div class="mo-ease__fig"><svg class="mo-curve" viewBox="-8 -30 116 146" aria-hidden="true"><path class="mo-axis" d="M0 100 H100 M0 100 V0"/><path class="mo-line" d="M0 100 C5 30 10 0 100 0"/></svg><span class="mo-track"><i></i></span></div><b>Decelerate</b><small>들어올 때. 화면 밖에서 빠르게 들어와 천천히 멈춥니다.</small><code>--cs-easing-decelerate</code><code>cubic-bezier(0, 0.6, 0.2, 1)</code></div><div class="mo-ease" style="--e:var(--cs-easing-accelerate)"><div class="mo-ease__fig"><svg class="mo-curve" viewBox="-8 -30 116 146" aria-hidden="true"><path class="mo-axis" d="M0 100 H100 M0 100 V0"/><path class="mo-line" d="M0 100 C30 100 80 85 100 0"/></svg><span class="mo-track"><i></i></span></div><b>Accelerate</b><small>나갈 때. 천천히 출발해 빠르게 사라집니다.</small><code>--cs-easing-accelerate</code><code>cubic-bezier(0.4, 0, 0.9, 0.3)</code></div><div class="mo-ease" style="--e:var(--cs-easing-linear)"><div class="mo-ease__fig"><svg class="mo-curve" viewBox="-8 -30 116 146" aria-hidden="true"><path class="mo-axis" d="M0 100 H100 M0 100 V0"/><path class="mo-line" d="M0 100 C0 100 100 0 100 0"/></svg><span class="mo-track"><i></i></span></div><b>Linear</b><small>반복 · 진행률처럼 속도가 일정해야 할 때.</small><code>--cs-easing-linear</code><code>cubic-bezier(0, 0, 1, 1)</code></div><div class="mo-ease" style="--e:var(--cs-easing-overshoot)"><div class="mo-ease__fig"><svg class="mo-curve" viewBox="-8 -30 116 146" aria-hidden="true"><path class="mo-axis" d="M0 100 H100 M0 100 V0"/><path class="mo-line" d="M0 100 C34 -36 64 0 100 0"/></svg><span class="mo-track"><i></i></span></div><b>Overshoot</b><small>완료 체크 · 배지처럼 작은 성공 신호에만. 살짝 넘쳤다 돌아옵니다.</small><code>--cs-easing-overshoot</code><code>cubic-bezier(0.34, 1.36, 0.64, 1)</code></div></div></section>
<section id="loop" class="mt-sec"><h2>Loop</h2><p>끝을 알 수 없는 기다림에는 같은 동작을 반복합니다. 반복은 일정한 속도로, 눈에 거슬리지 않게 느리게 돕니다.</p><div class="dk-table mt-table"><table><thead><tr><th>쓰는 곳</th><th>한 바퀴</th><th>곡선</th><th>변수</th></tr></thead><tbody><tr><td><b>로딩 스피너</b></td><td>1000ms</td><td>Linear</td><td><code>--cs-motion-loop-spinner-duration</code></td></tr><tr><td><b>스켈레톤 깜빡임</b></td><td>1500ms</td><td>Standard (오가며 반복)</td><td><code>--cs-motion-loop-skeleton-duration</code></td></tr><tr><td><b>목록이 차례로 나타날 때</b></td><td>항목마다 30ms씩 늦게</td><td>—</td><td><code>--cs-motion-stagger</code></td></tr></tbody></table></div></section>
<section id="reduced" class="mt-sec"><h2>Reduced Motion</h2><p>기기에서 <b>동작 줄이기</b>를 켠 고객에게는 움직임을 짧은 페이드로 바꿉니다. 시간 값은 자동으로 줄어들고, 위치 이동(올라옴 · 밀림)은 각 컴포넌트가 빼고 투명도만 바꿉니다.</p><div class="dk-table mt-table"><table><thead><tr><th>상황</th><th>기본</th><th>동작 줄이기</th></tr></thead><tbody><tr><td>큰 요소 등장 · 화면 전환 · 강조</td><td>300 · 300 · 400ms</td><td><b>150ms</b> 페이드</td></tr><tr><td>작은 요소 등장</td><td>200ms</td><td><b>100ms</b></td></tr><tr><td>큰 · 작은 요소 퇴장</td><td>200 · 150ms</td><td><b>100ms</b></td></tr><tr><td>목록 차례로 나타남</td><td>30ms 간격</td><td><b>한꺼번에</b> (0ms)</td></tr><tr><td>누름 반응 · 상태 바뀜</td><td>100 · 150ms</td><td>그대로 (위치 이동이 없음)</td></tr></tbody></table></div></section>
<section id="rules" class="mt-sec"><h2>Usage Rules</h2><div class="mt-dodont mt-dodont--text"><div class="mt-dd mt-dd--do"><p class="mt-dd__label">이렇게</p><p>시간과 곡선은 상황 이름(<code>--cs-motion-enter-*</code> 등)으로 한 번에 가져다 씁니다.</p></div><div class="mt-dd mt-dd--dont"><p class="mt-dd__label">이렇게 말고</p><p>화면마다 0.35초, ease-in-out처럼 값을 새로 만들지 않습니다.</p></div></div><div class="mt-dodont mt-dodont--text"><div class="mt-dd mt-dd--do"><p class="mt-dd__label">이렇게</p><p>들어오는 것은 아래 · 가까운 곳에서, 나가는 것은 들어온 방향으로 돌아갑니다. 바텀시트는 아래로 내려가며 사라집니다.</p></div><div class="mt-dd mt-dd--dont"><p class="mt-dd__label">이렇게 말고</p><p>한 화면에서 여러 요소를 동시에 크게 움직이지 않습니다. 움직임은 한 번에 하나가 주인공입니다.</p></div></div><div class="mt-dodont mt-dodont--text"><div class="mt-dd mt-dd--do"><p class="mt-dd__label">이렇게</p><p>Overshoot는 완료 체크 · 새 알림 배지처럼 작은 성공 신호에만 씁니다.</p></div><div class="mt-dd mt-dd--dont"><p class="mt-dd__label">이렇게 말고</p><p>반복 움직임(깜빡임 · 흔들림)으로 시선을 끌지 않습니다. 반복은 로딩에만 씁니다.</p></div></div></section>
<footer>CESCO Mobile Design System · v0.9</footer>
</template>
<template id="tpl-button">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>버튼 <small class="pi-en">Button</small></h1></div>
<nav class="mt-toc" aria-label="이 페이지 목차"><a href="#w-anatomy">Structure</a><a href="#w-variants">Type</a><a href="#w-states">State</a></nav>
<section id="glance" class="mt-sec mt-sec--intro"><p class="mt-lead">현재 화면에서 수행할 수 있는 주요 행동을 실행하는 요소입니다. 신청하기, 결제, 저장 등 고객이 다음 단계로 진행할 때 사용합니다.</p><ul class="tf-rules"><li>위계는 1~4순위 네 가지이며, 한 화면에 1순위 버튼은 하나만 둡니다.</li><li>크기는 세 가지이며, 화면 하단 고정 버튼은 큼(52), 본문 영역은 보통(44)을 사용합니다.</li><li>상태는 기본 · 누름 · 로딩 · 비활성 네 가지이며, 색이나 모양을 직접 바꾸지 않고 상태로 표현합니다.</li><li>되돌릴 수 없는 행동(해지 · 삭제)은 위험 버튼을 쓰고, 확인 단계를 함께 둡니다.</li></ul></section><section id="w-anatomy" class="mt-sec"><h2>Structure</h2><figure class="mf mf--labels mf--white" data-fig="1"><button class="ui-btn ui-btn--rank1 ui-btn--lg" type="button" data-pin="4" data-pin-dir="b" style="transform:scale(1.25)"><svg class="cs-icon" data-pin="1" data-pin-dir="l" aria-hidden="true"><use href="#cs-i-calendar"/></svg><span data-pin="2">Button</span><svg class="cs-icon" data-pin="3" data-pin-dir="r" aria-hidden="true"><use href="#cs-i-chevron-right"/></svg></button></figure><ol class="mt-anatomy"><li><b>1</b>앞쪽 아이콘</li><li><b>2</b>레이블</li><li><b>3</b>뒤쪽 아이콘</li><li><b>4</b>바탕</li></ol></section><section id="w-variants" class="mt-sec"><h2>Type</h2><h3 class="mt-sub" id="type-style" data-toc="Style">Style</h3><p>버튼 스타일은 위계에 따라 1~4순위와 위험, 다섯 가지입니다.</p><figure class="mf mf--white mf--type"><div class="mf-row" style="gap:32px;align-items:flex-end"><div class="mf-col"><button class="ui-btn ui-btn--rank1 ui-btn--md" type="button" tabindex="-1">Button</button><span class="mf-cap">1순위<br><span class="bt-h2">가장 중요한 행동</span></span></div><div class="mf-col"><button class="ui-btn ui-btn--rank2 ui-btn--md" type="button" tabindex="-1">Button</button><span class="mf-cap">2순위<br><span class="bt-h2">대체 행동</span></span></div><div class="mf-col"><button class="ui-btn ui-btn--rank3 ui-btn--md" type="button" tabindex="-1">Button</button><span class="mf-cap">3순위<br><span class="bt-h2">상태를 바꾸는 행동</span></span></div><div class="mf-col"><button class="ui-btn ui-btn--rank4 ui-btn--md" type="button" tabindex="-1">Button</button><span class="mf-cap">4순위<br><span class="bt-h2">흐름에서 빠지는 행동</span></span></div><div class="mf-col"><button class="ui-btn ui-btn--danger ui-btn--md" type="button" tabindex="-1">Button</button><span class="mf-cap">위험<br><span class="bt-h2">되돌릴 수 없는 행동</span></span></div></div></figure><h3 class="mt-sub" id="type-size" data-toc="Size">Size</h3><p>크기는 작음, 보통, 큼 세 가지입니다. 보통(44)은 최소 터치 크기를 기준으로 하고, 너비는 배치에 맞춰 정하지만 높이는 크기별로 정해진 값을 지킵니다.</p><figure class="mf mf--white mf--type"><div class="mf-row" style="gap:40px;align-items:flex-end"><div class="mf-col"><button class="ui-btn ui-btn--rank1 ui-btn--sm" type="button" tabindex="-1">Button</button><span class="mf-cap">작음<br><span class="bt-h">height: 36px</span></span></div><div class="mf-col"><button class="ui-btn ui-btn--rank1 ui-btn--md" type="button" tabindex="-1">Button</button><span class="mf-cap">보통<br><span class="bt-h">height: 44px</span></span></div><div class="mf-col"><button class="ui-btn ui-btn--rank1 ui-btn--lg" type="button" tabindex="-1">Button</button><span class="mf-cap">큼<br><span class="bt-h">height: 52px</span></span></div></div></figure><h3 class="mt-sub" id="type-icon" data-toc="Icon">Icon</h3><p>아이콘은 없음, 앞쪽, 뒤쪽, 아이콘만 중에서 선택합니다.</p><figure class="mf mf--white mf--type"><div class="mf-row" style="gap:40px;align-items:flex-end"><div class="mf-col"><button class="ui-btn ui-btn--rank1 ui-btn--md" type="button" tabindex="-1">Button</button><span class="mf-cap">없음</span></div><div class="mf-col"><button class="ui-btn ui-btn--rank1 ui-btn--md" type="button" tabindex="-1"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-calendar"/></svg>Button</button><span class="mf-cap">앞쪽 아이콘과 레이블</span></div><div class="mf-col"><button class="ui-btn ui-btn--rank1 ui-btn--md" type="button" tabindex="-1">Button<svg class="cs-icon" aria-hidden="true"><use href="#cs-i-chevron-right"/></svg></button><span class="mf-cap">뒤쪽 아이콘과 레이블</span></div><div class="mf-col"><button class="ui-btn ui-btn--rank1 ui-btn--md ui-btn--icon-only" type="button" tabindex="-1" aria-label="Button"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-calendar"/></svg></button><span class="mf-cap">아이콘만</span></div></div></figure></section><section id="w-states" class="mt-sec"><h2>State</h2><p>버튼 상태는 기본(Enabled) · 누름(Pressed) · 로딩(Loading) · 비활성(Disabled) 네 가지입니다. 순위와 위험 버튼 모두 상태 표현은 같습니다.</p><figure class="mf mf--white" data-fig="2"><div class="mf-grid bt-states" style="grid-template-columns:56px repeat(4, auto) auto"><span></span><span class="mf-cap">Enabled</span><span class="mf-cap">Pressed</span><span class="mf-cap">Loading</span><span class="mf-cap">Disabled</span><span></span><span class="mf-cap mf-cap--strong">1순위</span><button class="ui-btn ui-btn--rank1 ui-btn--lg ui-press" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--rank1 ui-btn--lg ui-press is-pressed" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--rank1 ui-btn--lg ui-press is-loading" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--rank1 ui-btn--lg ui-press" type="button" tabindex="-1" disabled>Button</button><span class="bt-states__desc">가장 중요한 행동</span><span class="mf-cap mf-cap--strong">2순위</span><button class="ui-btn ui-btn--rank2 ui-btn--lg ui-press" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--rank2 ui-btn--lg ui-press is-pressed" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--rank2 ui-btn--lg ui-press is-loading" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--rank2 ui-btn--lg ui-press" type="button" tabindex="-1" disabled>Button</button><span class="bt-states__desc">대체 행동</span><span class="mf-cap mf-cap--strong">3순위</span><button class="ui-btn ui-btn--rank3 ui-btn--lg ui-press" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--rank3 ui-btn--lg ui-press is-pressed" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--rank3 ui-btn--lg ui-press is-loading" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--rank3 ui-btn--lg ui-press" type="button" tabindex="-1" disabled>Button</button><span class="bt-states__desc">상태를 바꾸는 행동</span><span class="mf-cap mf-cap--strong">4순위</span><button class="ui-btn ui-btn--rank4 ui-btn--lg ui-press" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--rank4 ui-btn--lg ui-press is-pressed" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--rank4 ui-btn--lg ui-press is-loading" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--rank4 ui-btn--lg ui-press" type="button" tabindex="-1" disabled>Button</button><span class="bt-states__desc">흐름에서 빠지는 행동</span><span class="mf-cap mf-cap--strong">위험</span><button class="ui-btn ui-btn--danger ui-btn--lg ui-press" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--danger ui-btn--lg ui-press is-pressed" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--danger ui-btn--lg ui-press is-loading" type="button" tabindex="-1">Button</button><button class="ui-btn ui-btn--danger ui-btn--lg ui-press" type="button" tabindex="-1" disabled>Button</button><span class="bt-states__desc">되돌릴 수 없는 행동 확정</span></div></figure></section>
<footer>CESCO Mobile Design System · v0.9</footer>
</template>
<template id="tpl-icon-button">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>아이콘 버튼 <small class="pi-en">IconButton</small></h1></div>
<nav class="mt-toc" aria-label="이 페이지 목차"><a href="#w-anatomy">Structure</a><a href="#w-variants">Type</a><a href="#w-states">State</a><a href="#w-scale-with-icon-padding">Scale with icon padding</a></nav>
<section id="glance" class="mt-sec mt-sec--intro"><p class="mt-lead">텍스트 없이 아이콘 하나로 행동을 실행하는 버튼입니다. 뒤로 가기, 알림, 공유 등 누구나 바로 알아볼 수 있는 행동에만 사용합니다.</p></section><section id="w-anatomy" class="mt-sec"><h2>Structure</h2><figure class="mf mf--labels mf--white" data-fig="1"><button class="ui-ibtn ui-ibtn--solid ui-ibtn--xl" type="button" aria-label="알림" data-pin="2" data-pin-dir="r" style="transform:scale(1.4)"><span data-pin="1" data-pin-dir="l" style="display:inline-grid"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></span></button></figure><ol class="mt-anatomy"><li><b>1</b>아이콘</li><li><b>2</b>바탕</li></ol></section><section id="w-variants" class="mt-sec"><h2>Type</h2><h3 class="mt-sub" id="type-style" data-toc="Style">Style</h3><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><button type="button" aria-label="알림" class="ui-ibtn ui-ibtn--normal ui-ibtn--xl"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><span class="mf-cap">기본</span></div><div class="mf-col"><button type="button" aria-label="알림" class="ui-ibtn ui-ibtn--solid ui-ibtn--xl"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><span class="mf-cap">채움</span></div><div class="mf-col"><button type="button" aria-label="알림" class="ui-ibtn ui-ibtn--outlined ui-ibtn--xl"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><span class="mf-cap">테두리</span></div></div></figure><h3 class="mt-sub" id="type-size" data-toc="Size">Size</h3><figure class="mf mf--white" data-fig="3"><div class="mf-grid" style="grid-template-columns:repeat(4, auto);gap:18px 48px">
    <span class="mf-cap">Small</span><span class="mf-cap">Medium</span><span class="mf-cap">Large</span><span class="mf-cap">Xlarge</span>
    <span class="mf-measure"><button class="ui-ibtn ui-ibtn--normal ui-ibtn--s" type="button" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><i class="mf-hbar" data-size="height: 16px"></i></span>
    <span class="mf-measure"><button class="ui-ibtn ui-ibtn--normal ui-ibtn--m" type="button" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><i class="mf-hbar" data-size="height: 20px"></i></span>
    <span class="mf-measure"><button class="ui-ibtn ui-ibtn--normal ui-ibtn--l" type="button" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><i class="mf-hbar" data-size="height: 24px"></i></span>
    <span class="mf-measure"><button class="ui-ibtn ui-ibtn--normal ui-ibtn--xl" type="button" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><i class="mf-hbar" data-size="height: 28px"></i></span>
  </div></figure><p>기본 크기가 있지만 아이콘 크기와 안쪽 여백을 조절해 바꿀 수 있습니다. 크기와 여백은 2px 단위로만 바꿉니다.</p></section><section id="w-states" class="mt-sec"><h2>State</h2><p>아이콘 버튼 상태는 기본(Normal) · 누름(Pressed) · 비활성(Disabled) 세 가지입니다.</p><figure class="mf mf--white" data-fig="2"><div class="mf-grid bt-states" style="grid-template-columns:56px repeat(3, auto)"><span></span><span class="mf-cap">Normal</span><span class="mf-cap">Pressed</span><span class="mf-cap">Disabled</span><span class="mf-cap mf-cap--strong">기본</span><button class="ui-ibtn ui-ibtn--normal ui-ibtn--l" type="button" tabindex="-1" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><button class="ui-ibtn ui-ibtn--normal ui-ibtn--l is-pressed" type="button" tabindex="-1" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><button class="ui-ibtn ui-ibtn--normal ui-ibtn--l" type="button" tabindex="-1" aria-label="알림" disabled><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><span class="mf-cap mf-cap--strong">채움</span><button class="ui-ibtn ui-ibtn--solid ui-ibtn--l" type="button" tabindex="-1" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><button class="ui-ibtn ui-ibtn--solid ui-ibtn--l is-pressed" type="button" tabindex="-1" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><button class="ui-ibtn ui-ibtn--solid ui-ibtn--l" type="button" tabindex="-1" aria-label="알림" disabled><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><span class="mf-cap mf-cap--strong">테두리</span><button class="ui-ibtn ui-ibtn--outlined ui-ibtn--l" type="button" tabindex="-1" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><button class="ui-ibtn ui-ibtn--outlined ui-ibtn--l is-pressed" type="button" tabindex="-1" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><button class="ui-ibtn ui-ibtn--outlined ui-ibtn--l" type="button" tabindex="-1" aria-label="알림" disabled><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button></div></figure></section><section id="w-scale-with-icon-padding" class="mt-sec"><h2>Scale with icon padding</h2><figure class="mf" data-fig="12"><div class="mf-grid" style="grid-template-columns:repeat(3, auto);gap:18px 56px">
    <span class="mf-cap">Padding 8</span><span class="mf-cap">Padding 6</span><span class="mf-cap">Padding 4</span>
    <button class="ui-ibtn ui-ibtn--solid" type="button" aria-label="알림" style="--ui-ib-box:40px;--ui-ib-ic:24px"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button>
    <button class="ui-ibtn ui-ibtn--solid" type="button" aria-label="알림" style="--ui-ib-box:40px;--ui-ib-ic:28px"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button>
    <button class="ui-ibtn ui-ibtn--solid" type="button" aria-label="알림" style="--ui-ib-box:40px;--ui-ib-ic:32px"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button>
  </div></figure><p>채움 · 테두리형은 안쪽 여백을 바꾸면 아이콘 크기도 함께 바뀌게 할 수 있습니다. 여백을 그대로 두면 아이콘은 기본 크기를 유지합니다.</p></section>
<footer>CESCO Mobile Design System · v0.9</footer>
</template>
<template id="tpl-text-button">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>텍스트 버튼 <small class="pi-en">TextButton</small></h1></div>
<nav class="mt-toc" aria-label="이 페이지 목차"><a href="#w-anatomy">Structure</a><a href="#w-variants">Type</a><a href="#w-states">State</a></nav>
<section id="glance" class="mt-sec mt-sec--intro"><p class="mt-lead">배경과 테두리 없이 텍스트로만 구성된 가벼운 버튼입니다. 더보기, 전체 보기, 다시 보내기 등 우선순위가 낮은 행동이나 이동에 사용합니다.</p></section><section id="w-anatomy" class="mt-sec"><h2>Structure</h2><figure class="mf mf--labels mf--white" data-fig="1"><button class="ui-tbtn ui-tbtn--brand ui-tbtn--l" type="button" style="transform:scale(1.5)"><span data-pin="1" data-pin-dir="l" style="display:inline-flex"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-camera"/></svg></span><span data-pin="2" data-pin-dir="b">Text button</span><span data-pin="3" data-pin-dir="r" style="display:inline-flex"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-chevron-right"/></svg></span></button></figure><ol class="mt-anatomy"><li><b>1</b>앞쪽 아이콘</li><li><b>2</b>레이블</li><li><b>3</b>뒤쪽 아이콘</li></ol></section><section id="w-variants" class="mt-sec"><h2>Type</h2><h3 class="mt-sub" id="type-color" data-toc="Color">Color</h3><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><button type="button" class="ui-tbtn ui-tbtn--m ui-tbtn--brand">Text button</button><span class="mf-cap">주요</span></div><div class="mf-col"><button type="button" class="ui-tbtn ui-tbtn--m ui-tbtn--neutral">Text button</button><span class="mf-cap">보조</span></div></div></figure><h3 class="mt-sub" id="type-leading-icon" data-toc="Leading icon">Leading icon</h3><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><button type="button" class="ui-tbtn ui-tbtn--m ui-tbtn--brand">Text button</button><span class="mf-cap">레이블만</span></div><div class="mf-col"><button type="button" class="ui-tbtn ui-tbtn--m ui-tbtn--brand"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-camera"/></svg>Text button</button><span class="mf-cap">앞쪽 아이콘 + 레이블</span></div></div></figure><h3 class="mt-sub" id="type-trailing-icon" data-toc="Trailing icon">Trailing icon</h3><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><button type="button" class="ui-tbtn ui-tbtn--m ui-tbtn--brand">Text button</button><span class="mf-cap">레이블만</span></div><div class="mf-col"><button type="button" class="ui-tbtn ui-tbtn--m ui-tbtn--brand">Text button<svg class="cs-icon" aria-hidden="true"><use href="#cs-i-chevron-right"/></svg></button><span class="mf-cap">레이블 + 뒤쪽 아이콘</span></div></div></figure><h3 class="mt-sub" id="type-size" data-toc="Size">Size</h3><figure class="mf mf--white" data-fig="3"><div class="mf-grid" style="grid-template-columns:repeat(2, auto);gap:18px 72px">
    <span class="mf-cap">Small</span><span class="mf-cap">Medium</span>
    <span class="mf-measure"><button class="ui-tbtn ui-tbtn--brand ui-tbtn--s" type="button">Text button</button><i class="mf-hbar" data-size="height: 28px"></i></span>
    <span class="mf-measure"><button class="ui-tbtn ui-tbtn--brand ui-tbtn--m" type="button">Text button</button><i class="mf-hbar" data-size="height: 36px"></i></span>
  </div></figure><p>너비는 글자 길이에 맞춰 정해지고, 높이는 크기별로 정해진 값을 지킵니다.</p></section><section id="w-states" class="mt-sec"><h2>State</h2><p class="bt-state-lead">상태는 기본(Normal) · 누름(Pressed) · 비활성(Disabled) 세 가지입니다.</p><figure class="mf mf--white" data-fig="2"><div class="mf-grid" style="grid-template-columns:80px auto auto auto;gap:16px 20px">
    <span></span><span class="mf-cap">Normal</span><span class="mf-cap">Pressed</span><span class="mf-cap">Disabled</span>
    <span class="mf-cap mf-cap--strong">Primary</span><button class="ui-tbtn ui-tbtn--brand" type="button">Normal</button><button class="ui-tbtn ui-tbtn--brand is-pressed" type="button">Pressed</button><button class="ui-tbtn ui-tbtn--brand" type="button" disabled>Disabled</button>
    <span class="mf-cap mf-cap--strong">Assistive</span><button class="ui-tbtn ui-tbtn--neutral" type="button">Normal</button><button class="ui-tbtn ui-tbtn--neutral is-pressed" type="button">Pressed</button><button class="ui-tbtn ui-tbtn--neutral" type="button" disabled>Disabled</button>
  </div></figure></section>
<footer>CESCO Mobile Design System · v0.9</footer>

<template id="tpl-text-field">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>입력 필드 <small class="pi-en">TextField</small></h1></div>
<nav class="mt-toc" aria-label="이 페이지 목차"><a href="#w-anatomy">Structure</a><a href="#w-variants">Type</a><a href="#w-states">State</a></nav>
<section id="glance" class="mt-sec mt-sec--intro"><p class="mt-lead">고객에게 정보를 입력받는 영역입니다. 이름, 연락처, 주소 등 짧은 값은 한 줄 입력, 요청 사항 등 긴 글은 여러 줄 입력을 사용하고, 레이블과 안내 문구로 입력할 내용을 알려줍니다.</p><ul class="tf-rules"><li>라벨은 항상 표시하며, 플레이스홀더로 대체하지 않습니다.</li><li>오류 메시지는 입력이 끝난 뒤 표시하며, 해결 방법을 함께 안내합니다.</li><li>한 줄에 하나의 항목을 배치하고, 입력 값에 맞는 키보드가 자동으로 열리도록 합니다.</li><li>형식이 정해진 값은 입력 예시를 제공하고, 비활성 필드는 비활성화 사유를 안내합니다.</li></ul></section><section id="w-anatomy" class="mt-sec"><h2>Structure</h2><p>레이블, 입력 박스, 도움말로 구성됩니다. 필수 표시 · 앞뒤 아이콘 · 도움말은 필요할 때만 씁니다.</p><figure class="mf mf--labels mf--white"><div class="ui-fc ui-fc--m" style="width:328px"><label class="ui-fc__label"><span data-pin="1" data-pin-dir="l">Label</span><em data-pin="2" data-pin-dir="t">*</em></label><div class="ui-tf ui-tf--l is-filled" data-pin="3" data-pin-dir="b" data-pin-len="44"><span class="ui-tf__lead" data-pin="4" data-pin-dir="l"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-search"/></svg></span><span class="ui-tf__value">Text</span><span class="ui-tf__trail"><span class="ui-tf__clear" data-pin="5" data-pin-dir="r"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-close"/></svg></span></span></div><div class="ui-fc__foot"><p class="ui-fc__msg" data-pin="6" data-pin-dir="l">Helper text</p></div></div></figure><ol class="mt-anatomy"><li><b>1</b>레이블</li><li><b>2</b>필수 표시</li><li><b>3</b>입력 박스</li><li><b>4</b>앞 아이콘(선택)</li><li><b>5</b>뒤 아이콘(선택)</li><li><b>6</b>도움말 · 오류 메시지</li></ol></section><section id="w-variants" class="mt-sec"><h2>Type</h2><h3 class="mt-sub" id="type-line" data-toc="Line">Line</h3><p>짧은 값은 한 줄, 요청 사항처럼 긴 글은 여러 줄 입력을 씁니다. 목록에서 고르는 값은 Select를 씁니다.</p><figure class="mf mf--white mf--type"><div class="tf-types"><div class="tf-col"><div class="ui-fc ui-fc--m"><label class="ui-fc__label">Label</label><div class="ui-tf ui-tf--l is-filled"><span class="ui-tf__value">Text</span></div></div><span class="mf-cap">Single line<br><span class="bt-h2">한 줄 · 이름 · 연락처</span></span></div><div class="tf-col"><div class="ui-fc ui-fc--m"><label class="ui-fc__label">Label</label><div class="ui-ta ui-ta--l is-filled"><div class="ui-ta__value">Text<br>Text</div><div class="ui-ta__bottom"><span class="ui-ta__count">10/500</span></div></div></div><span class="mf-cap">Multi line<br><span class="bt-h2">여러 줄 · 글자 수 표시</span></span></div></div></figure><h3 class="mt-sub" id="type-icon" data-toc="Icon">Icon</h3><p>아이콘은 입력을 돕는 역할만 합니다. 앞에는 입력 내용을 알려 주는 아이콘, 뒤에는 지우기 · 비밀번호 보기 같은 동작 아이콘을 둡니다.</p><figure class="mf mf--white mf--type"><div class="tf-types"><div class="tf-col"><div class="ui-fc ui-fc--m"><label class="ui-fc__label">Label</label><div class="ui-tf ui-tf--l"><span class="ui-tf__lead"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-search"/></svg></span><span class="ui-tf__value">Placeholder</span></div></div><span class="mf-cap">Leading<br><span class="bt-h2">앞 아이콘 · 검색</span></span></div><div class="tf-col"><div class="ui-fc ui-fc--m"><label class="ui-fc__label">Label</label><div class="ui-tf ui-tf--l is-filled"><span class="ui-tf__value">Text</span><span class="ui-tf__trail"><span class="ui-tf__clear"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-close"/></svg></span></span></div></div><span class="mf-cap">Clear<br><span class="bt-h2">지우기 · 입력 중에만</span></span></div><div class="tf-col"><div class="ui-fc ui-fc--m"><label class="ui-fc__label">Label</label><div class="ui-tf ui-tf--l is-filled"><span class="ui-tf__value">••••••••</span><span class="ui-tf__trail"><span class="ui-tf__action" aria-label="비밀번호 보기"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-eye"/></svg></span></span></div></div><span class="mf-cap">Password<br><span class="bt-h2">비밀번호 보기</span></span></div></div></figure><h3 class="mt-sub" id="type-size" data-toc="Size">Size</h3><p>기본은 큼(52)입니다. 필터처럼 좁은 영역에서만 보통(44)을 씁니다.</p><figure class="mf mf--white mf--type"><div class="tf-types"><div class="tf-col"><div class="ui-fc ui-fc--m"><label class="ui-fc__label">Label</label><div class="ui-tf ui-tf--l is-filled"><span class="ui-tf__value">Text</span></div></div><span class="mf-cap">Large<br><span class="bt-h2">height 52</span></span></div><div class="tf-col"><div class="ui-fc ui-fc--m"><label class="ui-fc__label">Label</label><div class="ui-tf ui-tf--m is-filled"><span class="ui-tf__value">Text</span></div></div><span class="mf-cap">Medium<br><span class="bt-h2">height 44</span></span></div></div></figure></section><section id="w-states" class="mt-sec"><h2>State</h2><p class="bt-state-lead">상태는 기본(Enabled) · 포커스(Focused) · 입력됨(Filled) · 오류(Error) · 비활성(Disabled) · 읽기 전용(Read-only) 여섯 가지입니다.</p><figure class="mf mf--white mf--type"><div class="tf-types"><div class="tf-col"><div class="ui-fc ui-fc--m"><label class="ui-fc__label">Label</label><div class="ui-tf ui-tf--l"><span class="ui-tf__value">Placeholder</span></div><div class="ui-fc__foot"><p class="ui-fc__msg">Helper text</p></div></div><span class="mf-cap">Enabled<br><span class="bt-h2">입력 전</span></span></div><div class="tf-col"><div class="ui-fc ui-fc--m"><label class="ui-fc__label">Label</label><div class="ui-tf ui-tf--l is-focus"><span class="ui-tf__value"><span class="ui-caret"></span></span></div></div><span class="mf-cap">Focused<br><span class="bt-h2">입력 중</span></span></div><div class="tf-col"><div class="ui-fc ui-fc--m"><label class="ui-fc__label">Label</label><div class="ui-tf ui-tf--l is-filled"><span class="ui-tf__value">Text</span></div></div><span class="mf-cap">Filled<br><span class="bt-h2">입력 끝남</span></span></div><div class="tf-col"><div class="ui-fc ui-fc--m is-error"><label class="ui-fc__label">Label</label><div class="ui-tf ui-tf--l is-filled is-error"><span class="ui-tf__value">Text</span></div><div class="ui-fc__foot"><p class="ui-fc__msg">Error message</p></div></div><span class="mf-cap">Error<br><span class="bt-h2">오류 · 해결 방법 안내</span></span></div><div class="tf-col"><div class="ui-fc ui-fc--m"><label class="ui-fc__label">Label</label><div class="ui-tf ui-tf--l is-disabled"><span class="ui-tf__value">Placeholder</span></div></div><span class="mf-cap">Disabled<br><span class="bt-h2">입력할 수 없음</span></span></div><div class="tf-col"><div class="ui-fc ui-fc--m"><label class="ui-fc__label">Label</label><div class="ui-tf ui-tf--l is-filled is-readonly"><span class="ui-tf__value">Text</span></div></div><span class="mf-cap">Read-only<br><span class="bt-h2">보기만 · 복사 가능</span></span></div></div></figure></section><footer>CESCO Mobile Design System · v0.9</footer>
</template>
<template id="tpl-checkbox">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>체크박스 <small class="pi-en">Checkbox</small></h1></div>
<nav class="mt-toc" aria-label="이 페이지 목차"><a href="#w-anatomy">Structure</a><a href="#w-variants">Type</a><a href="#w-states">State</a></nav>
<section id="glance" class="mt-sec mt-sec--intro"><p class="mt-lead">여러 선택지 중 원하는 항목을 개수 제한 없이 선택하거나 약관에 동의할 때 사용하는 요소입니다. 체크 표시는 상자 없이 체크만 보여주는 가벼운 형태로, 읽음과 확인 여부를 나타냅니다.</p></section><section id="w-anatomy" class="mt-sec"><h2>Structure</h2><p class="cx-src">Checkbox</p><figure class="mf mf--labels mf--white" data-fig="1"><div style="transform:scale(1.6)"><label class="ui-ctl ui-ctl--m is-on"><span class="ui-ctl__box" data-pin="1" data-pin-dir="l"></span><span class="ui-ctl__label" data-pin="2" data-pin-dir="r">서울</span></label></div></figure><ol class="mt-anatomy"><li><b>1</b>조작부</li><li><b>2</b>레이블</li></ol><p class="cx-src">Check Mark</p><figure class="mf mf--labels mf--white" data-fig="1"><div style="transform:scale(1.6)"><label class="ui-ctl ui-ctl--m ui-ctl--mark is-on"><span class="ui-ctl__box" data-pin="1" data-pin-dir="l"></span><span class="ui-ctl__label" data-pin="2" data-pin-dir="r">예약 안내 확인</span></label></div></figure><ol class="mt-anatomy"><li><b>1</b>조작부</li><li><b>2</b>레이블</li></ol></section><section id="w-variants" class="mt-sec"><h2>Type</h2><h3 class="mt-sub" id="type-style" data-toc="Style">Style</h3><p>체크박스와 체크 표시 두 가지 종류가 있습니다.</p><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><div class="ui-ctl-list"><label class="ui-ctl ui-ctl--m ui-ctl--bold is-on" style="outline:1px dashed var(--cs-border-default)"><span class="ui-ctl__box"></span><span class="ui-ctl__label">서울</span></label><label class="ui-ctl ui-ctl--m ui-ctl--bold" style="outline:1px dashed var(--cs-border-default)"><span class="ui-ctl__box"></span><span class="ui-ctl__label">경기</span></label></div><span class="mf-cap">체크박스<br><span class="bt-h2">여러 개를 고르거나 동의할 때</span></span></div><div class="mf-col"><label class="ui-ctl ui-ctl--mark is-on ui-ctl--m" style="outline:1px dashed var(--cs-border-default)"><span class="ui-ctl__box"></span><span class="ui-ctl__label">예약 안내 확인</span></label><span class="mf-cap">체크 표시<br><span class="bt-h2">상자 없이 체크만, 가벼운 선택</span></span></div></div></figure><h3 class="mt-sub" id="type-size" data-toc="Size">Size</h3><p>크기는 작음, 보통 두 가지입니다.</p><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><div class="ui-ctl-list"><label class="ui-ctl ui-ctl--s ui-ctl--bold is-on" style="outline:1px dashed var(--cs-border-default)"><span class="ui-ctl__box"></span><span class="ui-ctl__label">서울</span></label><label class="ui-ctl ui-ctl--s ui-ctl--bold" style="outline:1px dashed var(--cs-border-default)"><span class="ui-ctl__box"></span><span class="ui-ctl__label">경기</span></label></div><span class="mf-cap">작음</span></div><div class="mf-col"><div class="ui-ctl-list"><label class="ui-ctl ui-ctl--m ui-ctl--bold is-on" style="outline:1px dashed var(--cs-border-default)"><span class="ui-ctl__box"></span><span class="ui-ctl__label">서울</span></label><label class="ui-ctl ui-ctl--m ui-ctl--bold" style="outline:1px dashed var(--cs-border-default)"><span class="ui-ctl__box"></span><span class="ui-ctl__label">경기</span></label></div><span class="mf-cap">보통</span></div></div></figure></section><section id="w-states" class="mt-sec"><h2>State</h2><p class="bt-state-lead">상태는 기본(Normal) · 누름(Pressed) · 비활성(Disabled) 세 가지입니다.</p><figure class="mf mf--white" data-fig="2"><div class="mf-grid" style="grid-template-columns:80px 140px 140px 140px;gap:14px 10px;justify-items:start">
    <span></span><span class="mf-cap">Unchecked</span><span class="mf-cap">Checked</span><span class="mf-cap">Indeterminate</span>

<template id="tpl-switch">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>스위치 <small class="pi-en">Switch</small></h1></div>
<nav class="mt-toc" aria-label="이 페이지 목차"><a href="#w-anatomy">Structure</a><a href="#w-variants">Type</a><a href="#w-states">State</a></nav>
<section id="glance" class="mt-sec mt-sec--intro"><p class="mt-lead">설정을 즉시 켜고 끄는 요소입니다. 누르는 즉시 적용되므로 별도의 저장 버튼이 필요하지 않습니다.</p></section><section id="w-anatomy" class="mt-sec"><h2>Structure</h2><figure class="mf mf--labels mf--white" data-fig="1"><div style="transform:scale(1.8)"><button class="ui-sw ui-sw--m" type="button" role="switch" aria-checked="false" data-pin="2" data-pin-dir="r"><i data-pin="1" data-pin-dir="l" style="position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%"></i></button></div></figure><ol class="mt-anatomy"><li><b>1</b>손잡이</li><li><b>2</b>바탕</li></ol></section><section id="w-variants" class="mt-sec"><h2>Type</h2><h3 class="mt-sub" id="type-size" data-toc="Size">Size</h3><figure class="mf mf--white" data-fig="3"><div class="mf-grid" style="grid-template-columns:auto auto;gap:14px 60px"><span class="mf-cap">작음</span><span class="mf-cap">보통</span><span class="mf-measure"><button class="ui-sw ui-sw--s is-on" type="button" role="switch" aria-checked="true"></button><i class="mf-hbar" data-size="height: 24px"></i></span><span class="mf-measure"><button class="ui-sw ui-sw--m is-on" type="button" role="switch" aria-checked="true"></button><i class="mf-hbar" data-size="height: 32px"></i></span></div></figure><p>높이 24px(작음) · 32px(보통) 두 가지 크기가 있습니다.</p></section><section id="w-states" class="mt-sec"><h2>State</h2><p class="bt-state-lead">상태는 기본(Normal) · 누름(Pressed) · 비활성(Disabled) 세 가지입니다.</p><figure class="mf mf--white" data-fig="2"><div class="mf-grid" style="grid-template-columns:80px 80px 80px;gap:16px 20px">
    <span></span><span class="mf-cap">Inactive</span><span class="mf-cap">Active</span>
    <span class="mf-cap mf-cap--strong">Normal</span><button class="ui-sw ui-sw--m" type="button" role="switch" aria-checked="false"></button><button class="ui-sw ui-sw--m is-on" type="button" role="switch" aria-checked="true"></button>
    <span class="mf-cap mf-cap--strong">Pressed</span><button class="ui-sw ui-sw--m is-pressed" type="button" role="switch" aria-checked="false"></button><button class="ui-sw ui-sw--m is-on is-pressed" type="button" role="switch" aria-checked="true"></button>
    <span class="mf-cap mf-cap--strong">Disabled</span><button class="ui-sw ui-sw--m is-disabled" type="button" role="switch" aria-checked="false"></button><button class="ui-sw ui-sw--m is-on is-disabled" type="button" role="switch" aria-checked="true"></button>
  </div></figure></section>
<footer>CESCO Mobile Design System · v0.9</footer>
</template>
<template id="tpl-segmented">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>세그먼트 <small class="pi-en">Segmented</small></h1></div>
<nav class="mt-toc" aria-label="이 페이지 목차"><a href="#w-anatomy">Structure</a><a href="#w-variants">Type</a><a href="#w-states">State</a></nav>
<section id="glance" class="mt-sec mt-sec--intro"><p class="mt-lead">2~4개의 선택지를 한 줄로 이어 두고 하나를 선택하는 요소입니다. 같은 내용을 다른 방식으로 보거나 목록을 상태별로 필터링할 때 사용합니다.</p></section><section id="w-anatomy" class="mt-sec"><h2>Structure</h2><figure class="mf mf--labels mf--white" data-fig="1"><div style="width:300px;transform:scale(1.2)"><div class="ui-seg ui-seg--m" data-pin="3" data-pin-dir="b"><button class="ui-seg__item is-active" type="button" data-pin="1" data-pin-dir="t"><span data-pin="2" data-pin-dir="l">월간</span></button><button class="ui-seg__item" type="button">주간</button><button class="ui-seg__item" type="button">일간</button></div></div></figure><ol class="mt-anatomy"><li><b>1</b>세그먼트</li><li><b>2</b>레이블</li><li><b>3</b>바탕</li></ol></section><section id="w-variants" class="mt-sec"><h2>Type</h2><h3 class="mt-sub" id="type-style" data-toc="Style">Style</h3><p>텍스트만, 아이콘과 텍스트, 아이콘만 세 가지 구성이 있습니다.</p><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><div style="width:340px"><div class="ui-seg ui-seg--s" role="radiogroup"><button type="button" role="radio" class="ui-seg__item is-active">목록</button><button type="button" role="radio" class="ui-seg__item">달력</button><button type="button" role="radio" class="ui-seg__item">지도</button></div></div><span class="mf-cap">텍스트만</span></div><div class="mf-col"><div style="width:340px"><div class="ui-seg ui-seg--s" role="radiogroup"><button type="button" role="radio" class="ui-seg__item is-active"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-report"/></svg>목록</button><button type="button" role="radio" class="ui-seg__item"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-calendar"/></svg>달력</button><button type="button" role="radio" class="ui-seg__item"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-location"/></svg>지도</button></div></div><span class="mf-cap">아이콘과 텍스트</span></div><div class="mf-col"><div style="width:340px"><div class="ui-seg ui-seg--s" role="radiogroup"><button type="button" role="radio" class="ui-seg__item is-active" aria-label="목록"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-report"/></svg></button><button type="button" role="radio" class="ui-seg__item" aria-label="달력"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-calendar"/></svg></button><button type="button" role="radio" class="ui-seg__item" aria-label="지도"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-location"/></svg></button></div></div><span class="mf-cap">아이콘만</span></div></div></figure></section><section id="w-states" class="mt-sec"><h2>State</h2><p class="bt-state-lead">상태는 선택됨(Selected) · 기본(Normal) 두 가지입니다. 한 번에 하나만 선택됩니다.</p><figure class="mf mf--white" data-fig="2"><div class="mf-grid" style="grid-template-columns:80px 160px;gap:14px"><span class="mf-cap mf-cap--strong">Selected</span><div class="ui-seg ui-seg--m" role="radiogroup"><button class="ui-seg__item is-active" type="button" role="radio" aria-checked="true">월간</button></div><span class="mf-cap mf-cap--strong">Normal</span><div class="ui-seg ui-seg--m" role="radiogroup"><button class="ui-seg__item" type="button" role="radio" aria-checked="false">월간</button></div></div></figure></section>
<footer>CESCO Mobile Design System · v0.9</footer>
</template>
<template id="tpl-chip">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>칩 <small class="pi-en">Chip</small></h1></div>
<nav class="mt-toc" aria-label="이 페이지 목차"><a href="#w-anatomy">Structure</a><a href="#w-variants">Type</a><a href="#w-states">State</a></nav>
<section id="glance" class="mt-sec mt-sec--intro"><p class="mt-lead">짧은 값을 작은 단위로 보여주고 선택하게 하는 요소입니다. 칩은 선택할 수 있는 값을 나열할 때, 필터 칩은 조건 목록을 열어 목록을 필터링할 때 사용합니다.</p></section><section id="w-anatomy" class="mt-sec"><h2>Structure</h2><p class="cx-src">Chip</p><figure class="mf mf--labels mf--white" data-fig="1"><button class="ui-chip ui-chip--outlined ui-chip--l" type="button" data-pin="4" data-pin-dir="b" style="transform:scale(1.4)"><span data-pin="1" data-pin-dir="l" style="display:inline-flex"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></span><span data-pin="2">Option 1</span><span data-pin="3" data-pin-dir="r" style="display:inline-flex"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-close"/></svg></span></button></figure><ol class="mt-anatomy"><li><b>1</b>앞쪽 요소</li><li><b>2</b>레이블</li><li><b>3</b>뒤쪽 요소</li><li><b>4</b>바탕</li></ol><p class="cx-src">Filter Chip</p><figure class="mf mf--labels mf--white" data-fig="1"><div style="transform:scale(1.8)"><button class="ui-filter ui-filter--outlined ui-filter--s" type="button" data-pin="2" data-pin-dir="b"><span data-pin="1" data-pin-dir="l">Filter</span><span data-pin="3" data-pin-dir="r" style="display:inline-flex"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-chevron-down"/></svg></span></button></div></figure><ol class="mt-anatomy"><li><b>1</b>레이블</li><li><b>2</b>바탕</li><li><b>3</b>뒤쪽 아이콘</li></ol></section><section id="w-variants" class="mt-sec"><h2>Type</h2><h3 class="mt-sub" id="type-style" data-toc="Style">Style</h3><p>채움과 테두리 두 가지 종류가 있습니다.</p><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><button type="button" class="ui-chip ui-press ui-chip--m ui-chip--solid">Option 1</button><span class="mf-cap">채움</span></div><div class="mf-col"><button type="button" class="ui-chip ui-press ui-chip--m ui-chip--outlined">Option 1</button><span class="mf-cap">테두리</span></div></div></figure><h3 class="mt-sub" id="type-size" data-toc="Size">Size</h3><figure class="mf mf--white" data-fig="3"><div class="mf-grid" style="grid-template-columns:repeat(4, auto);gap:18px 56px">
    <span class="mf-cap">아주 작음</span><span class="mf-cap">작음</span><span class="mf-cap">보통</span><span class="mf-cap">큼</span>
    <span class="mf-measure"><button class="ui-chip ui-chip--outlined ui-chip--xs" type="button">Chip</button><i class="mf-hbar" data-size="height: 28px"></i></span>
    <span class="mf-measure"><button class="ui-chip ui-chip--outlined ui-chip--s" type="button">Chip</button><i class="mf-hbar" data-size="height: 32px"></i></span>
    <span class="mf-measure"><button class="ui-chip ui-chip--outlined ui-chip--m" type="button">Chip</button><i class="mf-hbar" data-size="height: 36px"></i></span>
    <span class="mf-measure"><button class="ui-chip ui-chip--outlined ui-chip--l" type="button">Chip</button><i class="mf-hbar" data-size="height: 40px"></i></span>
  </div></figure><p>너비는 글자 길이에 맞춰 늘어나고, 높이는 크기별로 고정합니다.</p></section><section id="w-states" class="mt-sec"><h2>State</h2><p class="bt-state-lead">상태는 기본(Normal) · 누름(Pressed) · 활성(Active) · 비활성(Disabled) 네 가지입니다.</p><figure class="mf mf--white" data-fig="2"><div class="mf-grid" style="grid-template-columns:72px auto auto auto auto;gap:14px 18px">
    <span></span><span class="mf-cap">Normal</span><span class="mf-cap">Pressed</span><span class="mf-cap">Active</span><span class="mf-cap">Disabled</span>
    <span class="mf-cap mf-cap--strong">Solid</span><button class="ui-chip ui-chip--solid ui-press" type="button">Normal</button><button class="ui-chip ui-chip--solid ui-press is-pressed" type="button">Pressed</button><button class="ui-chip ui-chip--solid is-active" type="button">Active</button><button class="ui-chip ui-chip--solid" type="button" disabled>Disabled</button>
    <span class="mf-cap mf-cap--strong">Outlined</span><button class="ui-chip ui-chip--outlined ui-press" type="button">Normal</button><button class="ui-chip ui-chip--outlined ui-press is-pressed" type="button">Pressed</button><button class="ui-chip ui-chip--outlined is-active" type="button">Active</button><button class="ui-chip ui-chip--outlined" type="button" disabled>Disabled</button>
  </div></figure></section>
<footer>CESCO Mobile Design System · v0.9</footer>
</template>
<template id="tpl-list">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>리스트 <small class="pi-en">List</small></h1></div>
<nav class="mt-toc" aria-label="이 페이지 목차"><a href="#w-anatomy">Structure</a><a href="#w-variants">Type</a><a href="#w-states">State</a></nav>
<section id="glance" class="mt-sec mt-sec--intro"><p class="mt-lead">같은 종류의 정보를 한 줄씩 세로로 나열하는 요소입니다. 앞쪽 아이콘, 레이블, 설명, 뒤쪽 값을 조합해 설정 메뉴부터 이용 내역까지 대부분의 목록 화면에 사용합니다.</p></section><section id="w-anatomy" class="mt-sec"><h2>Structure</h2><p>목록의 각 줄은 좌우 12px 안쪽에 두고 모서리를 둥글게 처리합니다. 눌렀을 때도 둥근 회색 바탕으로 표시됩니다.</p><figure class="mf mf--labels mf--white" data-fig="1"><div class="lsf-box" style="width:340px;transform:scale(1.15)"><div class="ui-cell ui-cell--inset ui-cell--m" data-pin="5" data-pin-dir="b" data-pin-len="26" style="box-shadow:inset 0 -1px 0 var(--cs-divider);border-radius:0"><span class="ui-cell__lead" data-pin="1" data-pin-dir="t"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></span><span class="ui-cell__text"><span class="ui-cell__label"><span data-pin="2" data-pin-dir="t">Label</span></span><span class="ui-cell__desc"><span data-pin="4" data-pin-dir="l" data-pin-len="50">Description</span></span></span><span class="ui-cell__trail" data-pin="3" data-pin-dir="r"><svg class="cs-icon ui-cell__chev" aria-hidden="true"><use href="#cs-i-chevron-right"/></svg></span></div></div></figure><ol class="mt-anatomy"><li><b>1</b>앞쪽 요소</li><li><b>2</b>레이블</li><li><b>3</b>뒤쪽 요소</li><li><b>4</b>설명</li><li><b>5</b>구분선</li></ol></section><section id="w-variants" class="mt-sec"><h2>Type</h2><h3 class="mt-sub" id="type-leading" data-toc="Leading">Leading</h3><p>왼쪽에는 항목이 무엇인지 알려 주는 요소를 둡니다. 한 목록 안에서는 같은 종류만 씁니다.</p><figure class="mf mf--white mf--type"><div class="tf-types"><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__lead"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></span><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span></span></div></div><span class="mf-cap">Icon<br><span class="bt-h2">아이콘 · 메뉴 · 설정</span></span></div><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__lead"><span class="ui-cell__lead--large"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-calendar"/></svg></span></span><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span><span class="ui-cell__desc">Description</span></span></div></div><span class="mf-cap">Large icon<br><span class="bt-h2">큰 아이콘 · 서비스 · 기능</span></span></div><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__lead"><span class="ui-avatar ui-avatar--person ui-avatar--m"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-user"/></svg></span></span><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span><span class="ui-cell__desc">Description</span></span></div></div><span class="mf-cap">Avatar<br><span class="bt-h2">사람 · 담당자</span></span></div><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__lead"><span class="ls-thumb"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-camera"/></svg></span></span><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span><span class="ui-cell__desc">Description</span></span></div></div><span class="mf-cap">Thumbnail<br><span class="bt-h2">사진 · 상품 · 게시글</span></span></div><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__lead"><span class="ui-cbox is-on"></span></span><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span></span></div></div><span class="mf-cap">Checkbox<br><span class="bt-h2">여러 개 고르기</span></span></div><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__lead"><span class="ui-radio is-on"></span></span><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span></span></div></div><span class="mf-cap">Radio<br><span class="bt-h2">하나만 고르기</span></span></div></div></figure><h3 class="mt-sub" id="type-trailing" data-toc="Trailing">Trailing</h3><p>오른쪽에는 값이나 동작을 둡니다. 화살표는 다른 화면으로 이동할 때만 쓰고, 스위치는 누르는 즉시 적용됩니다.</p><figure class="mf mf--white mf--type"><div class="tf-types"><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span></span><span class="ui-cell__trail"><svg class="cs-icon ui-cell__chev" aria-hidden="true"><use href="#cs-i-chevron-right"/></svg></span></div></div><span class="mf-cap">Chevron<br><span class="bt-h2">다른 화면으로 이동</span></span></div><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span></span><span class="ui-cell__trail">Value</span></div></div><span class="mf-cap">Value<br><span class="bt-h2">현재 값 · 날짜 · 금액</span></span></div><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span></span><span class="ui-cell__trail"><span class="ui-cbadge ui-cbadge--solid ui-cbadge--neutral ui-cbadge--s">Badge</span></span></div></div><span class="mf-cap">Badge<br><span class="bt-h2">상태 · 새 소식</span></span></div><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span></span><span class="ui-cell__trail"><span class="ui-switch is-on"></span></span></div></div><span class="mf-cap">Switch<br><span class="bt-h2">켜고 끄기 · 바로 적용</span></span></div><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span></span><span class="ui-cell__trail"><button class="ui-tbtn ui-tbtn--brand ui-tbtn--s" type="button">Button</button></span></div></div><span class="mf-cap">Text button<br><span class="bt-h2">항목별 보조 행동</span></span></div><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m is-selected"><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span></span><span class="ui-cell__trail"><svg class="cs-icon ui-cell__check" aria-hidden="true"><use href="#cs-i-check"/></svg></span></div></div><span class="mf-cap">Check<br><span class="bt-h2">선택된 항목 표시</span></span></div></div></figure><h3 class="mt-sub" id="type-lines" data-toc="Lines">Lines</h3><p>레이블과 설명은 각각 한 줄을 넘으면 말줄임합니다. 2줄 이상이면 앞뒤 요소를 위쪽에 맞춥니다.</p><figure class="mf mf--white mf--type"><div class="tf-types"><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__lead"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></span><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span></span><span class="ui-cell__trail"><svg class="cs-icon ui-cell__chev" aria-hidden="true"><use href="#cs-i-chevron-right"/></svg></span></div></div><span class="mf-cap">1 line<br><span class="bt-h2">레이블만</span></span></div><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m"><span class="ui-cell__lead"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></span><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span><span class="ui-cell__desc">Description</span></span><span class="ui-cell__trail"><svg class="cs-icon ui-cell__chev" aria-hidden="true"><use href="#cs-i-chevron-right"/></svg></span></div></div><span class="mf-cap">2 lines<br><span class="bt-h2">레이블 + 설명</span></span></div><div class="tf-col"><div class="ls-card"><div class="ui-cell ui-cell--inset ui-cell--m ui-cell--top"><span class="ui-cell__lead"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></span><span class="ui-cell__text"><span class="ui-cell__label"><span>Label</span></span><span class="ui-cell__desc ls-wrap">Description that runs onto a second line</span></span><span class="ui-cell__trail"><svg class="cs-icon ui-cell__chev" aria-hidden="true"><use href="#cs-i-chevron-right"/></svg></span></div></div><span class="mf-cap">Top align<br><span class="bt-h2">설명이 길 때</span></span></div></div></figure></section><section id="w-states" class="mt-sec"><h2>State</h2><p class="bt-state-lead">상태는 기본(Normal) · 누름(Pressed) · 비활성(Disabled) 세 가지입니다.</p><figure class="mf mf--white" data-fig="2"><div class="mf-grid" style="grid-template-columns:80px 300px;gap:10px 14px">

<template id="tpl-badge">
<div class="page-intro mt-intro"><span class="section-id"></span><h1>배지 <small class="pi-en">Badge</small></h1></div>
<nav class="mt-toc" aria-label="이 페이지 목차"><a href="#w-anatomy">Structure</a><a href="#w-variants">Type</a></nav>
<section id="glance" class="mt-sec mt-sec--intro"><p class="mt-lead">상태나 분류를 짧게 표시하는 요소입니다. 텍스트 배지는 이용 중, 이용 예정 등 상태를, 숫자와 점 배지는 아이콘 위에서 새 소식이 있음을 알려줍니다.</p></section><section id="w-anatomy" class="mt-sec"><h2>Structure</h2><p class="cx-src">Text Badge</p><figure class="mf mf--labels mf--white" data-fig="1"><span class="ui-cbadge ui-cbadge--outlined ui-cbadge--neutral ui-cbadge--m" data-pin="4" data-pin-dir="b" style="transform:scale(1.8)"><span data-pin="1" data-pin-dir="l" style="display:inline-flex"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-clock"/></svg></span><span data-pin="2" data-pin-dir="t">Label</span><span data-pin="3" data-pin-dir="r" style="display:inline-flex"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-chevron-right"/></svg></span></span></figure><ol class="mt-anatomy"><li><b>1</b>앞쪽 아이콘</li><li><b>2</b>레이블</li><li><b>3</b>뒤쪽 아이콘</li><li><b>4</b>바탕</li></ol><p class="cx-src">Count &amp; Dot Badge</p><figure class="mf mf--labels mf--white" data-fig="1"><div class="mf-row" style="gap:80px;transform:scale(1.8)"><span class="ui-pdot ui-pdot--m" data-pin="1" data-pin-dir="l"></span><span class="ui-pcount ui-pcount--m" data-pin="2" data-pin-dir="l"><span data-pin="3" data-pin-dir="r">1</span></span></div></figure><ol class="mt-anatomy"><li><b>1</b>점 배지</li><li><b>2</b>바탕</li><li><b>3</b>레이블</li></ol></section><section id="w-variants" class="mt-sec"><h2>Type</h2><p class="cx-src">Text Badge</p><h3 class="mt-sub" id="type-style" data-toc="Style">Style</h3><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><span class="ui-cbadge ui-cbadge--m ui-cbadge--solid ui-cbadge--neutral">Label</span><span class="mf-cap">채움</span></div><div class="mf-col"><span class="ui-cbadge ui-cbadge--m ui-cbadge--outlined ui-cbadge--neutral">Label</span><span class="mf-cap">테두리</span></div></div></figure><h3 class="mt-sub" id="type-status" data-toc="Status">Status · 점 + 글자</h3><figure class="mf mf--white mf--type mf--opts"><div class="mf-row" style="gap:36px"><div class="mf-col"><span class="ui-cbadge ui-cbadge--dot ui-cbadge--success">완료</span><span class="mf-cap">success · green-500</span></div><div class="mf-col"><span class="ui-cbadge ui-cbadge--dot ui-cbadge--info">진행중</span><span class="mf-cap">info · blue-500</span></div><div class="mf-col"><span class="ui-cbadge ui-cbadge--dot ui-cbadge--warning">대기</span><span class="mf-cap">warning · orange-400</span></div><div class="mf-col"><span class="ui-cbadge ui-cbadge--dot ui-cbadge--danger">오류</span><span class="mf-cap">danger · red-500</span></div></div></figure><ul class="mt-ul"><li>목록 · 카드에서 진행 상태를 보여 줄 때 씁니다. 바탕 없이 <b>점 + 글자 한 색</b>, 글자 13 · 600.</li><li><code>&lt;span class="ui-cbadge ui-cbadge--dot ui-cbadge--success"&gt;완료&lt;/span&gt;</code> — 상태 색은 <code>--ui-cb-dot</code>으로 바꿀 수 있습니다.</li><li>흰 바탕에서 글자 대비가 4.5:1에 못 미칩니다(디자인 결정). 접근성 기준이 필요한 화면은 글자만 700 단계로 씁니다.</li></ul><p class="cx-src">Count &amp; Dot Badge</p><h3 class="mt-sub" id="type-style-2" data-toc="Style">Style</h3><figure class="mf mf--white mf--type mf--opts"><div class="mf-row"><div class="mf-col"><span class="ui-pbadge-anchor"><button class="ui-ibtn ui-ibtn--outlined ui-ibtn--l" type="button" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><span class="ui-pdot ui-pdot--xs"></span></span><span class="mf-cap">점</span></div><div class="mf-col"><span class="ui-pbadge-anchor"><button class="ui-ibtn ui-ibtn--outlined ui-ibtn--l" type="button" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><span class="ui-pcount ui-pcount--xs">3</span></span><span class="mf-cap">글자</span></div><div class="mf-col"><span class="ui-pbadge-anchor"><button class="ui-ibtn ui-ibtn--outlined ui-ibtn--l" type="button" aria-label="알림"><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-bell"/></svg></button><span class="ui-pcount ui-pcount--xs">99+</span></span><span class="mf-cap">최대 개수</span></div></div></figure><h3 class="mt-sub" id="type-size" data-toc="Size">Size</h3><figure class="mf mf--white" data-fig="2"><div class="mf-grid" style="grid-template-columns:repeat(3, auto);gap:18px 56px"><span class="mf-cap">아주 작음</span><span class="mf-cap">작음</span><span class="mf-cap">보통</span><span class="mf-measure"><span class="ui-cbadge ui-cbadge--solid ui-cbadge--neutral ui-cbadge--xs">Badge</span><i class="mf-hbar" data-size="height: 18px"></i></span><span class="mf-measure"><span class="ui-cbadge ui-cbadge--solid ui-cbadge--neutral ui-cbadge--s">Badge</span><i class="mf-hbar" data-size="height: 20px"></i></span><span class="mf-measure"><span class="ui-cbadge ui-cbadge--solid ui-cbadge--neutral ui-cbadge--m">Badge</span><i class="mf-hbar" data-size="height: 24px"></i></span></div></figure><p>너비는 글자 길이에 맞춰 늘어나고, 높이는 크기별로 고정합니다.</p></section>
<footer>CESCO Mobile Design System · v0.9</footer>
</template>
<template id="tpl-section-title">
