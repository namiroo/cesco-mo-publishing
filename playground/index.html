<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 플레이그라운드 | 세스코 모바일 오피스</title>
<!-- 원본: 04_Design/playground.html → python3 tools/build.py 가 05_Deliver/playground.html 로 복사 (화면 목록 주입) -->
<style>
  :root { --ink:#1B1F23; --sub:#4E5358; --mute:#676C71; --line:#E4E8EC; --bg:#F1F3F5; --acc:#0070DC; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; color:var(--ink); background:var(--bg); }
  .pg { display:grid; grid-template-columns:1fr 340px; min-height:100vh; }
  .stage { display:flex; flex-direction:column; align-items:center; gap:16px; padding:24px; overflow:auto; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .bar select, .bar button { height:36px; padding:0 12px; border:1px solid var(--line); border-radius:8px; background:#fff; font:inherit; color:var(--ink); cursor:pointer; }
  .bar button[aria-pressed="true"] { border-color:var(--ink); font-weight:700; }
  .phones { display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
  .phone { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .phone span { color:var(--mute); font-size:12px; font-variant-numeric:tabular-nums; }
  .phone iframe { height:844px; border:0; border-radius:28px; background:#fff; box-shadow:0 0 0 8px #1B1F23, 0 20px 40px rgba(10,24,64,.18); }
  .panel { position:sticky; top:0; height:100vh; overflow:auto; padding:20px; background:#fff; border-left:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:18px; }
  .lead { margin:0 0 16px; color:var(--sub); font-size:13px; }
  .grp { margin:0 0 8px; border:1px solid var(--line); border-radius:10px; }
  .grp summary { display:flex; align-items:center; justify-content:space-between; min-height:44px; padding:0 12px; font-size:14px; font-weight:700; cursor:pointer; list-style:none; }
  .grp summary::-webkit-details-marker { display:none; }
  .grp summary::after { content:'+'; color:var(--mute); font-weight:400; }
  .grp[open] summary::after { content:'−'; }
  .grp > .row { padding:0 12px; }
  .grp > .row:last-child { padding-bottom:8px; }
  .grp:has(.changed) summary { color:var(--acc); }
  .row { display:grid; grid-template-columns:96px 1fr 56px; gap:8px; align-items:center; min-height:36px; }
  .row label { font-size:13px; }
  .row input[type=range] { width:100%; accent-color:var(--ink); }
  .row output { font-size:12px; color:var(--mute); text-align:right; font-variant-numeric:tabular-nums; }
  .row input[type=color] { width:100%; height:32px; padding:0 2px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .row select { grid-column:2 / 4; width:100%; height:32px; padding:0 8px; border:1px solid var(--line); border-radius:6px; background:#fff; font:inherit; font-size:13px; }
  .row input[type=checkbox] { justify-self:start; width:18px; height:18px; accent-color:var(--ink); }
  .row.changed label { font-weight:700; }
  .row.changed label::after { content:" •"; color:var(--acc); }
  .act { display:grid; gap:8px; position:sticky; bottom:-20px; margin:0 -20px -20px; padding:16px 20px 20px; background:#fff; border-top:1px solid var(--line); }
  .act button { height:44px; border:0; border-radius:10px; font:inherit; font-weight:700; cursor:pointer; }
  .act .p { background:var(--ink); color:#fff; }
  .act .s { background:var(--bg); color:var(--ink); }
  .act pre { margin:0; max-height:140px; overflow:auto; padding:10px; background:var(--bg); border-radius:8px; font-size:11px; white-space:pre-wrap; }
  .scope { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:0 0 16px; padding:4px; background:var(--bg); border-radius:10px; }
  .scope button { height:36px; border:0; border-radius:8px; background:none; font:inherit; font-size:13px; color:var(--sub); cursor:pointer; }
  .scope button[aria-pressed="true"] { background:#fff; color:var(--ink); font-weight:700; box-shadow:0 1px 2px rgba(10,24,64,.08); }
  .sec { margin:20px 0 8px; font-size:12px; font-weight:700; color:var(--mute); }
  .sec:first-of-type { margin-top:0; }
  .none { margin:0 0 8px; padding:12px; border-radius:10px; background:var(--bg); color:var(--sub); font-size:13px; }
  .grp summary small { margin-left:auto; margin-right:8px; color:var(--acc); font-size:12px; font-weight:700; }
  .phone-link { margin:0 0 16px; padding:10px 12px; border-radius:8px; font-size:12px; color:var(--sub); background:var(--bg); word-break:break-all; }
  .phone-link[data-ok="1"] { color:#036A49; background:#DAF5E4; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); padding:10px 16px; background:var(--ink); color:#fff; border-radius:999px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.on { opacity:1; }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  @media (max-width:900px) { .pg { grid-template-columns:1fr; } .panel { position:static; height:auto; border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div class="pg">
  <main class="stage">
    <div class="bar">
      <select id="screen" aria-label="화면 고르기"></select>
      <button type="button" data-w="390" aria-pressed="true">390</button>
      <button type="button" data-w="360" aria-pressed="false">360</button>
      <button type="button" data-w="both" aria-pressed="false">둘 다</button>
    </div>
    <div class="phones" id="phones"></div>
  </main>

  <aside class="panel" aria-label="디자인 값 조정">
    <h1>디자인 플레이그라운드</h1>
    <p class="lead">값을 바꾸면 화면에 바로 반영돼요. 마음에 들면 「Claude에 보낼 값 복사」 → 채팅에 붙여넣기 → 원본에 반영.</p>
    <p class="phone-link" id="phone" data-ok="0">폰 연동 서버가 꺼져 있어요 (tools/live_sync.py)</p>
    <div class="scope" role="group" aria-label="조절 묶음 범위">
      <button type="button" id="scopeScr" aria-pressed="true">이 화면</button>
      <button type="button" id="scopeAll" aria-pressed="false">모든 묶음</button>
    </div>
    <h2 class="sec" id="secScr">이 화면</h2>
    <div id="scrBox"></div>
    <p class="none" id="noneScr" hidden>이 화면 전용 조절 칸은 아직 없어요. 아래 공통 칸을 쓰세요.</p>
    <h2 class="sec">모든 화면 공통</h2>
    <div id="controls"></div>
    <div class="act">
      <pre id="diff">바뀐 값 없음</pre>
      <button type="button" class="p" id="copy">Claude에 보낼 값 복사</button>
      <button type="button" class="s" id="resetScr">이 화면 묶음만 처음 값으로</button>
      <button type="button" class="s" id="reset">전부 처음 값으로</button>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="_preview/screens.js"></script>

var KEY='cesco-playground-v16', state={};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
var all=[]; GROUPS.forEach(function(g){ g.items.forEach(function(i){ if (i.type==='select') i.def=i.options[0].v; all.push(i); if (!(i.id in state)) state[i.id]=i.def; }); });

/* 패널 만들기 */
var box=document.getElementById('controls'), scrBox=document.getElementById('scrBox'), showAll=false;
GROUPS.forEach(function(g){
  var fs=document.createElement('details'); fs.className='grp'; if (g.open) fs.open=true; fs.innerHTML='<summary>'+g.name+'<small></small></summary>';
  g.el=fs; g.items.forEach(function(i){ i.group=g.name; });
  g.items.forEach(function(i){
    var r=document.createElement('div'); r.className='row'; r.dataset.id=i.id; r.title=i.note;
    var input = i.type==='select' ? '<select id="c-'+i.id+'">'+i.options.map(function(o){ return '<option value="'+o.v+'">'+o.l+'</option>'; }).join('')+'</select>'
              : i.type==='range' ? '<input type="range" id="c-'+i.id+'" min="'+i.min+'" max="'+i.max+'" step="'+i.step+'">'
              : i.type==='color' ? '<input type="color" id="c-'+i.id+'">' : '<input type="checkbox" id="c-'+i.id+'">';
    r.innerHTML='<label for="c-'+i.id+'">'+i.label+'</label>'+input+'<output></output>';
    fs.appendChild(r);
    var el=r.querySelector('input, select');
    if (i.type==='check') el.checked=!!state[i.id]; else el.value=state[i.id];
    el.addEventListener('input', function(){ state[i.id] = i.type==='check' ? el.checked : (i.type==='range' ? Number(el.value) : el.value); sync(); });
  });
  (g.scr ? scrBox : box).appendChild(fs);
});
/* 화면별 묶음: 고른 화면에 해당하는 묶음만 「이 화면」에 보이고, 「모든 묶음」이면 다른 화면 것도 보임 */
function scope(){
  var n=0, cur=sel.value, name=(SCREENS.find(function(x){ return x.id===cur; })||{}).name||cur;
  GROUPS.forEach(function(g){ if (!g.scr) return; var mine=g.scr.indexOf(cur)>-1; g.el.hidden = !(mine || showAll); if (mine) n++;
    if (mine && !g.el.dataset.seen) { g.el.open=true; g.el.dataset.seen='1'; } });
  document.getElementById('secScr').textContent = showAll ? '화면별 묶음 (전부)' : '이 화면 · '+name;
  document.getElementById('noneScr').hidden = n>0 || showAll;
}
[['scopeScr',false],['scopeAll',true]].forEach(function(p){ document.getElementById(p[0]).addEventListener('click', function(){
  showAll=p[1]; document.getElementById('scopeScr').setAttribute('aria-pressed', !showAll); document.getElementById('scopeAll').setAttribute('aria-pressed', showAll); scope(); }); });

/* 화면 · 폭 */
var sel=document.getElementById('screen'), phones=document.getElementById('phones'), mode='390';
SCREENS.forEach(function(s){ var o=document.createElement('option'); o.value=s.id; o.textContent=s.name+' · '+s.id; sel.appendChild(o); });
function frames(){
  phones.innerHTML='';
  (mode==='both' ? [390,360] : [Number(mode)]).forEach(function(w){
    var p=document.createElement('div'); p.className='phone';
    p.innerHTML='<iframe title="'+w+' 미리보기" style="width:'+w+'px" src="_preview/www/html/'+sel.value+'.html"></iframe><span>'+w+' × 844</span>';
    p.querySelector('iframe').addEventListener('load', function(){ paint(this); });
    phones.appendChild(p);
  });
}
sel.addEventListener('change', function(){ frames(); push(); scope(); try { localStorage.setItem(KEY+'-screen', sel.value); } catch (e) {} });
try { var last=localStorage.getItem(KEY+'-screen'); if (last && SCREENS.some(function(x){ return x.id===last; })) sel.value=last; } catch (e) {}
document.querySelectorAll('[data-w]').forEach(function(b){ b.addEventListener('click', function(){ mode=b.dataset.w; document.querySelectorAll('[data-w]').forEach(function(x){ x.setAttribute('aria-pressed', x===b); }); frames(); }); });

/* 값 적용: iframe 안 html · body 에 덮어쓰기 (폰 미러에도 같은 값을 보냄) */
function collect(){
  var o={ vars:{}, rootFont:'' }, rootStub={ style:{} };
  all.forEach(function(i){ if (state[i.id]===i.def) return; i.apply(function(k,v){ o.vars[k]=v; }, state[i.id], rootStub); });
  o.rootFont = rootStub.style.fontSize || ''; return o;
}
function paint(f){
  var d; try { d=f.contentDocument; } catch (e) { return; } if (!d || !d.body) return;
  var o=collect();
  d.body.removeAttribute('style'); d.documentElement.style.fontSize=o.rootFont;
  for (var k in o.vars) d.body.style.setProperty(k, o.vars[k]);
}
var SYNC='http://'+location.hostname+':8790', pushT, LOCAL=location.protocol==='http:';   /* 공개본(https · GitHub Pages)에서는 폰 연동 서버에 접속하지 않음 */
function push(){ if (!LOCAL) return; clearTimeout(pushT); pushT=setTimeout(function(){ var o=collect(); o.screen=sel.value;
  fetch(SYNC+'/overrides',{ method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(o) }).then(function(){ link(true); }, function(){ link(false); }); }, 120); }
function link(ok){ var el=document.getElementById('phone'); if (!el) return; el.dataset.ok = ok ? '1' : '0'; }
if (!LOCAL) { var pe=document.getElementById('phone'); if (pe) pe.textContent='공개본 — 폰 실시간 연동은 로컬 미리보기에서만 돼요'; }
else fetch(SYNC+'/info').then(function(r){ return r.json(); }).then(function(j){
  var ip=(j.ips||[])[0]; var el=document.getElementById('phone'); if (!el || !ip) return;
  el.innerHTML='폰 실시간 보기: <b>http://'+ip+':8080/mirror.html</b>'; link(true);
}).catch(function(){ link(false); });

function sync(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  phones.querySelectorAll('iframe').forEach(paint); push();
  var lines=[];
  document.querySelectorAll('.row').forEach(function(r){
    var i=all.find(function(x){ return x.id===r.dataset.id; }), v=state[i.id], ch = v!==i.def;
    r.classList.toggle('changed', ch);
    var lab = function(val){ var o=(i.options||[]).find(function(x){ return x.v===val; }); return o ? o.l : val; };
    r.querySelector('output').textContent = i.type==='select' ? '' : i.type==='check' ? (v?'켬':'끔') : i.type==='range' ? v+i.unit : String(v).toUpperCase();
    if (ch) lines.push('- ['+i.group+'] '+i.label+' ('+i.note+'): '+(i.type==='check'?(i.def?'켬':'끔'):i.type==='select'?lab(i.def):i.def+(i.unit||''))+' → '+(i.type==='check'?(v?'켬':'끔'):i.type==='select'?lab(v):v+(i.unit||'')));
  });
  GROUPS.forEach(function(g){ var c=g.items.filter(function(i){ return state[i.id]!==i.def; }).length; g.el.querySelector('summary small').textContent = c ? c+'개 바꿈' : ''; });
  document.getElementById('diff').textContent = lines.length ? '화면: '+sel.value+'\n'+lines.join('\n') : '바뀐 값 없음';
}
document.getElementById('copy').addEventListener('click', function(){
  var t='[플레이그라운드] 아래 값으로 원본에 반영해줘\n'+document.getElementById('diff').textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ toast('복사했어요 — 채팅에 붙여넣으세요'); }, function(){ toast('복사가 막혔어요 — 아래 글을 직접 복사하세요'); });
});
function resetItems(list){ list.forEach(function(i){ state[i.id]=i.def; var el=document.getElementById('c-'+i.id); if (i.type==='check') el.checked=i.def; else el.value=i.def; }); sync(); }
document.getElementById('resetScr').addEventListener('click', function(){
  var list=[]; GROUPS.forEach(function(g){ if (g.scr && g.scr.indexOf(sel.value)>-1) list=list.concat(g.items); });
  if (!list.length) { toast('이 화면 전용 묶음이 없어요'); return; } resetItems(list); toast('이 화면 묶음을 처음 값으로 돌렸어요');
});
document.getElementById('reset').addEventListener('click', function(){
  all.forEach(function(i){ state[i.id]=i.def; var el=document.getElementById('c-'+i.id); if (i.type==='check') el.checked=i.def; else el.value=i.def; }); sync(); toast('처음 값으로 돌렸어요');
});
var tt; function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove('on'); }, 2200); }
frames(); scope(); sync();
</script>
