<div class="mo-app">
<main class="mo-main mo-login">
  <div class="mo-login__brand">
    <img class="mo-login__logo" src="../img/logo-cesco.svg" alt="CESCO">
    <h1 class="mo-login__title">모바일 오피스</h1>
    <p class="mo-login__desc">세스코 계정으로 로그인해 주세요</p>
  </div>

  <form class="mo-login__form" action="MOW-SC-010101.html" aria-label="로그인">
    <label class="mo-field">
      <span class="mo-field__label">계정</span>
      <span class="ui-tf ui-tf--l"><input class="mo-input" name="id" autocomplete="username" placeholder="사번 또는 아이디" value="kmj2041"></span>
    </label>
    <label class="mo-field">
      <span class="mo-field__label">비밀번호</span>
      <span class="ui-tf ui-tf--l"><input class="mo-input" name="pw" type="password" autocomplete="current-password" placeholder="비밀번호" value="cesco1234"><button class="mo-field__eye" type="button" aria-label="비밀번호 보기" aria-pressed="false" data-pw-toggle><svg class="cs-icon" aria-hidden="true"><use href="#cs-i-eye"/></svg></button></span>
    </label>
    <label class="ui-ctl ui-ctl--m mo-login__save"><input type="checkbox" class="ui-ctl__input" checked><span class="ui-ctl__box"></span><span class="ui-ctl__label">아이디 저장</span></label>
    <a class="ui-btn ui-btn--rank1 ui-btn--lg ui-btn--full mo-login__submit" href="MOW-SC-010101.html">로그인</a>
  </form>

  <p class="mo-login__help"><a href="#" data-todo>비밀번호를 잊으셨나요?</a></p>
  <p class="mo-login__demo">시연용 · 역할 바꿔 보기 <a href="MOW-SC-010101.html">SC 홈</a><a href="MOW-DE-010101.html">DE 홈</a></p>
</main>
</div>
<div class="mo-toast" aria-live="polite"><div class="ui-toast ui-toast--success" role="status"><svg class="cs-icon ui-toast__icon" aria-hidden="true"><use href="#cs-i-check"/></svg><span></span></div></div>
